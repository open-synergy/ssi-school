        save_as: "grade"
        values:
          name: "Grade IE2"
          code: "GRIE2"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
