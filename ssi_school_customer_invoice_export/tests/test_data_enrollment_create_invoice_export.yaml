      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School IE2"
          code: "SCIE2"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
