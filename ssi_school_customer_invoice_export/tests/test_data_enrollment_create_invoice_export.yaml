          code: "CLIE2"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create first student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_a"
        values:
          name: "Student Contact IE2A"

      - step: "Setup - create first student"
        action: "create"
        model: "school_student"
        save_as: "student_a"
        values:
          name: "Student IE2A"
          code: "STUIE2A"
          contact_id: "REC: contact_a.id"
          school_id: "REC: school.id"

      - step: "Setup - create second student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_b"
        values:
          name: "Student Contact IE2B"

      - step: "Setup - create second student"
        action: "create"
        model: "school_student"
        save_as: "student_b"
        values:
          name: "Student IE2B"
          code: "STUIE2B"
          contact_id: "REC: contact_b.id"
          school_id: "REC: school.id"

      - step: "Create first enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_a"
        values:
