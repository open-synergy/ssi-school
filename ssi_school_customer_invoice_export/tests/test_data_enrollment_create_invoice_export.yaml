  - name: "Wizard Without Enrollment Selected Raises UserError"
    steps:
      - step: "Setup - create export type"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "export_type"
        values:
          name: "Export Type IE3"
          code: "ETYIE3"
          default_output_format: "csv"

