options:
  auto_refresh: true
scenarios:
  - name: "Migration - Draft Enrollment With Unlocked Term And Detail"
    steps:
      - step: "Setup - get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "School Fee Income MIGLK1"
          code: "MIGLK14200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee MIGLK1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type MIGLK1"
          code: "GTMIGLK1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 MIGLK1"
          code: "AYMIGLK1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester MIGLK1"
          code: "SMMIGLK1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School MIGLK1"
          code: "SCHMIGLK1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade MIGLK1"
          code: "GMIGLK1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class MIGLK1"
          code: "CLAMIGLK1"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact MIGLK1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student MIGLK1"
          code: "STUMIGLK1"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Setup - get receivable journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "receivable_journal"
        limit: 1

      - step: "Create enrollment owned by admin"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        as_user: "base.user_admin"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: receivable_journal.id"

      - step: "Create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term"
        as_user: "base.user_admin"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term 1 MIGLK1"
          sequence: 10

      - step: "Create payment term detail"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail"
        as_user: "base.user_admin"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee MIGLK1"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0
