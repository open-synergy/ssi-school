            expected: "draft"

      - step: "Enrol the student again"
        action: "write"
        target: "student"
        values:
          state: "enrol"

      - step: "Assert student state is enrol"
        action: "assert"
        target: "student"
        asserts:
          state:
            type: "value"
            expected: "enrol"
