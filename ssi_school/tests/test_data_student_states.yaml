  - name: "Student State - Deceased Cannot Go Back To Enrol"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Transition Deceased"
          code: "GTTDCS"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Transition Deceased"
          code: "SCHTDCS"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Transition Contact Deceased"

      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Transition Student Deceased"
          code: "STUTDCS"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Write the student into deceased"
        action: "write"
        target: "student"
        values:
          state: "deceased"

      - step: "Assert student state is deceased"
        action: "assert"
        target: "student"
        asserts:
          state:
            type: "value"
            expected: "deceased"

      - step: "Going back to enrol is rejected"
        action: "write"
        target: "student"
        values:
          state: "enrol"
        expect_error:
          type: "ValidationError"

