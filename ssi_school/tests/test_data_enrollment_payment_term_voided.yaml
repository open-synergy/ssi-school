options:
  auto_refresh: true

scenarios:
  - name: "Voided detail is excluded from the term total"
    steps:
      - step: "Setup - get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "School Fee Income VD1"
          code: "VD14200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee VD1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type VD1"
          code: "GTVD1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 VD1"
          code: "AYVD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester VD1"
          code: "SMVD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School VD1"
          code: "SCHVD1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade VD1"
          code: "GVD1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class VD1"
          code: "CLAVD1"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact VD1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student VD1"
          code: "STUVD1"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term VD1"
          sequence: 10

      - step: "Create first detail (not voided)"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_1"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee VD1 A"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Create second detail (voided)"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_2"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee VD1 B"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0
          voided: true

      - step: "Assert the term total excludes the voided detail"
        action: "assert"
        target: "term"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 1000000.0
          amount_total:
            type: "value"
            expected: 1000000.0

