options:
  auto_refresh: true
scenarios:
  - name: "Enrollment Payment Term - Paid Follows Invoice, Then Back"
    steps:
      - step: "Setup - get customer invoice journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable PTPD1"
          code: "PTPD1"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type PTPD1"
          code: "PTPD1"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - get receivable journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "receivable_journal"
        limit: 1

      - step: "Setup - get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "School Fee Income PTPD1"
          code: "PTPD14200"
          user_type_id: "EVAL: registry['account_type'].id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee PTPD1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "Pricelist PTPD1"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type PTPD1"
          code: "GTPTPD1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 PTPD1"
          code: "AYPTPD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester PTPD1"
          code: "SMPTPD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School PTPD1"
          code: "SCHPTPD1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade PTPD1"
          code: "GPTPD1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class PTPD1"
          code: "CLAPTPD1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact PTPD1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student PTPD1"
          code: "STUPTPD1"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create payment template"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "payment_template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "Payment Template PTPD1"
          code: "PMTPTPD1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          term_ids:
            - - 0
              - 0
              - name: "Term 1 PTPD1"
                sequence: 10
                detail_ids:
                  - - 0
                    - 0
                    - product_id: "EVAL: registry['product'].id"
                      name: "Fee PTPD1"
                      account_id: "EVAL: registry['account'].id"
                      uom_quantity: 1.0
                      uom_id: "REF: uom.product_uom_unit"
                      price_unit: 1000000.0

      - step: "Create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student'].id"
          payment_template_id: "EVAL: registry['payment_template'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "EVAL: env.company.currency_id.id"
          receivable_journal_id: "EVAL: registry['receivable_journal'].id"

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Compute payment"
        action: "call"
        target: "enrollment"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Assert enrollment is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Get payment term"
        action: "search"
        model: "school_enrollment_payment_term"
        domain: [["enrollment_id", "=", "EVAL: registry['enrollment'].id"]]
        save_as: "term"
        expect_count: 1

      - step: "Create invoice"
        action: "call"
        target: "term"
        method: "action_create_invoice"

      - step: "Assert term is invoiced before payment"
        action: "assert"
        target: "term"
        asserts:
          customer_invoice_id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "invoiced"

      - step: "Get the created customer invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "EVAL: registry['term'].customer_invoice_id.id"]]
        save_as: "invoice"
        expect_count: 1

      - step:
          "Mark the customer invoice as paid (direct write, no reconciliation needed for
          this ORM-level Selection field)"
        action: "write"
        target: "invoice"
        values:
          state: "done"

      - step: "Assert the term follows the invoice to paid"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "paid"

      - step: "Move the customer invoice back to unpaid"
        action: "write"
        target: "invoice"
        values:
          state: "open"

      - step: "Assert the term reverts to invoiced (bidirectional compute)"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "invoiced"

