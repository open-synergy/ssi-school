      - step:
          "Force the enrollment into cancel (action_cancel itself refuses while a term
          is invoiced -- see _10_check_payment_term_invoice; this direct write isolates
          the compute-only guarantee under test)"
        action: "write"
        target: "enrollment"
        values:
          state: "cancel"

      - step:
          "Assert the term follows the enrollment to cancelled, even though its invoice
          is paid"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "cancelled"
