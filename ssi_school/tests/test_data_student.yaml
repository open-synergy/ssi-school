scenarios:
  - name: "Create Student"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Student Test"
          code: "GTSTU"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Student Test"
          code: "SCHSTU"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "New Student Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "New Student"
          code: "STU002"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Assert created"
        action: "assert"
        target: "student"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "New Student"
          school_id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  - name: "Edit Student Name"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Student Edit"
          code: "GTSTED"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Student Edit"
          code: "SCHSTED"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Edit Contact"
          phone: "081111111111"
          email: "student@test.com"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student 1"
          code: "STU001ED"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Write new name"
        action: "write"
        target: "student"
        values:
          name: "Student 1 Updated"
      - step: "Assert name updated"
        action: "assert"
        target: "student"
        asserts:
          name:
            type: "value"
            expected: "Student 1 Updated"

  - name: "Delete Student"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Student Del"
          code: "GTSTDL"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Student Del"
          code: "SCHSTDL"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student To Delete Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student To Delete"
          code: "STUDEL"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Delete student"
        action: "call"
        target: "student"
        method: "unlink"
      - step: "Search expects zero results"
        action: "search"
        model: "school_student"
        domain: [["code", "=", "STUDEL"]]
        save_as: "result"
        expect_count: 0

  - name: "Compute Initial Grade Type From School"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Student Compute"
          code: "GTSCO"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Student Compute"
          code: "SCHSCO"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Compute Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Compute Test"
          code: "STUCT"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Assert initial_grade_type_id from school"
        action: "assert"
        target: "student"
        asserts:
          initial_grade_type_id:
            type: "value"
            operator: "is_truthy"

  - name: "Compute Current Grade No Enrollment"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type No Enrol"
          code: "GTNE"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School No Enrol"
          code: "SCHNE"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade No Enrol"
          code: "GNE"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student No Enrol Contact"
      - step: "Create student with initial_grade_id"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student No Enrollment"
          code: "STUNE"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
          initial_grade_id: "EVAL: registry['grade'].id"
      - step: "Invalidate cache"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step: "Assert current_grade_id equals initial_grade_id"
        action: "assert"
        target: "student"
        asserts:
          current_grade_id:
            type: "value"
            operator: "is_truthy"

  - name: "Compute Next Grade Fallback Scoped To School Grade Type"
    steps:
      - step: "Create elementary grade type (sorts before junior high)"
        action: "create"
        model: "school_grade_type"
        save_as: "type_elementary"
        values:
          name: "Elementary Fallback Test"
          code: "ELFB"
          sequence: 10
      - step: "Create junior high grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "type_junior"
        values:
          name: "Junior High Fallback Test"
          code: "JHFB"
          sequence: 20
      - step: "Create elementary grade (global first grade)"
        action: "create"
        model: "school_grade"
        save_as: "el_grade"
        values:
          name: "Elementary Grade Fallback"
          code: "ELGFB"
          sequence: 10
          type_id: "EVAL: registry['type_elementary'].id"
      - step: "Create junior high grade (first grade of its own type)"
        action: "create"
        model: "school_grade"
        save_as: "jh_grade"
        values:
          name: "Junior High Grade Fallback"
          code: "JHGFB"
          sequence: 10
          type_id: "EVAL: registry['type_junior'].id"
      - step: "Create junior high school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "Junior High School Fallback"
          code: "SCHJHFB"
          grade_type_id: "EVAL: registry['type_junior'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Fallback Contact"
      - step: "Create student without initial_grade_id or enrollment"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Fallback Test"
          code: "STUFB"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Invalidate student cache"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step: "Assert next_grade_id is the junior high grade, not the elementary one"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['student'].next_grade_id.id"]
          - ["id", "=", "EVAL: registry['jh_grade'].id"]
        save_as: "check_fallback"
        expect_count: 1

  - name: "Compute Next Grade Fallback Without Any Grade"
    steps:
      - step: "Create empty grade type (no grades yet)"
        action: "create"
        model: "school_grade_type"
        save_as: "type_empty"
        values:
          name: "Empty Grade Type Fallback"
          code: "EGTFB"
          sequence: 30
      - step: "Create school using the empty grade type"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Empty Grade Type Fallback"
          code: "SCHEGTFB"
          grade_type_id: "EVAL: registry['type_empty'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Empty Fallback Contact"
      - step: "Create student without initial_grade_id or enrollment"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Empty Fallback Test"
          code: "STUEFB"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Invalidate student cache"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step: "Assert next_grade_id is falsy (no error)"
        action: "assert"
        target: "student"
        asserts:
          next_grade_id:
            type: "value"
            operator: "is_falsy"

  - name: "Compute Active Enrollment None"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type No Active Enrol"
          code: "GTNAE"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School No Active Enrol"
          code: "SCHNAE"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student No Active Enrol Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student No Active Enrol"
          code: "STUNAE"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Assert no active enrollment"
        action: "assert"
        target: "student"
        asserts:
          active_enrollment_id:
            type: "value"
            operator: "is_falsy"

  - name: "Action Set To Enroll"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Enroll Action"
          code: "GTEA"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Enroll Action"
          code: "SCHEA"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Enroll Action Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student For Enroll Action"
          code: "STUENR"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Assert initial state is draft"
        action: "assert"
        target: "student"
        asserts:
          state:
            type: "value"
            expected: "draft"
      - step: "Call action_set_to_enroll"
        action: "call"
        target: "student"
        method: "action_set_to_enroll"
        asserts:
          state:
            type: "value"
            expected: "enrol"

  - name: "Action Set To Draft"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Draft Action"
          code: "GTDA"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Draft Action"
          code: "SCHDA"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Draft Action Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student For Draft Action"
          code: "STUDRT"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Enroll then reset to draft"
        action: "call"
        target: "student"
        method: "action_set_to_enroll"
      - step: "Reset to draft"
        action: "call"
        target: "student"
        method: "action_set_to_draft"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Duplicate Code Allowed Across Different Schools"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Dup Code"
          code: "GTDUPC"
          sequence: 10
      - step: "Create school A"
        action: "create"
        model: "school"
        save_as: "school_a"
        values:
          name: "School Dup Code A"
          code: "SCHDUPA"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create school B"
        action: "create"
        model: "school"
        save_as: "school_b"
        values:
          name: "School Dup Code B"
          code: "SCHDUPB"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact for school A student"
        action: "create"
        model: "res.partner"
        save_as: "contact_a"
        values:
          name: "Student Dup Code Contact A"
      - step: "Create contact for school B student"
        action: "create"
        model: "res.partner"
        save_as: "contact_b"
        values:
          name: "Student Dup Code Contact B"
      - step: "Create student in school A with code DUP01"
        action: "create"
        model: "school_student"
        save_as: "student_a"
        values:
          name: "Student Dup Code A"
          code: "DUP01"
          contact_id: "EVAL: registry['contact_a'].id"
          school_id: "EVAL: registry['school_a'].id"
      - step: "Create student in school B with the same code DUP01"
        action: "create"
        model: "school_student"
        save_as: "student_b"
        values:
          name: "Student Dup Code B"
          code: "DUP01"
          contact_id: "EVAL: registry['contact_b'].id"
          school_id: "EVAL: registry['school_b'].id"
      - step: "Assert both students created"
        action: "assert"
        target: "student_a"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
      - step: "Assert second student created"
        action: "assert"
        target: "student_b"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"

  - name: "Duplicate Slash Code Allowed In Same School"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Slash Code"
          code: "GTSLC"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Slash Code"
          code: "SCHSLC"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact for first student"
        action: "create"
        model: "res.partner"
        save_as: "contact1"
        values:
          name: "Student Slash Code Contact 1"
      - step: "Create contact for second student"
        action: "create"
        model: "res.partner"
        save_as: "contact2"
        values:
          name: "Student Slash Code Contact 2"
      - step: "Create first student with code /"
        action: "create"
        model: "school_student"
        save_as: "student1"
        values:
          name: "Student Slash Code 1"
          code: "/"
          contact_id: "EVAL: registry['contact1'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Create second student with code / in the same school"
        action: "create"
        model: "school_student"
        save_as: "student2"
        values:
          name: "Student Slash Code 2"
          code: "/"
          contact_id: "EVAL: registry['contact2'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Assert first student created"
        action: "assert"
        target: "student1"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
      - step: "Assert second student created"
        action: "assert"
        target: "student2"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"

  - name: "Action Student State Transitions"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type State Trans"
          code: "GTST3"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School State Trans"
          code: "SCHST"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student State Trans Contact"
      - step: "Create student for on_leave"
        action: "create"
        model: "school_student"
        save_as: "student_ol"
        values:
          name: "Student For On Leave Action"
          code: "STUOL"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Set to on_leave"
        action: "call"
        target: "student_ol"
        method: "action_set_to_on_leave"
        asserts:
          state:
            type: "value"
            expected: "on_leave"
      - step: "Create student for graduate"
        action: "create"
        model: "school_student"
        save_as: "student_gr"
        values:
          name: "Student For Graduate Action"
          code: "STUGR"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Set to graduate"
        action: "call"
        target: "student_gr"
        method: "action_set_to_graduate"
        asserts:
          state:
            type: "value"
            expected: "graduate"
      - step: "Create student for dropped"
        action: "create"
        model: "school_student"
        save_as: "student_dp"
        values:
          name: "Student For Dropped Action"
          code: "STUDP"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Set to dropped"
        action: "call"
        target: "student_dp"
        method: "action_set_to_dropped"
        asserts:
          state:
            type: "value"
            expected: "dropped"

  - name: "Compute Current And Next Grade Uses Chronological Enrollment Order"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Chronological Order"
          code: "GTCHR"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Chronological Order"
          code: "SCHCHR"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade 1 (sequence 10)"
        action: "create"
        model: "school_grade"
        save_as: "grade_1"
        values:
          name: "Grade 1 Chronological"
          code: "G1CHR"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade 2 (sequence 20)"
        action: "create"
        model: "school_grade"
        save_as: "grade_2"
        values:
          name: "Grade 2 Chronological"
          code: "G2CHR"
          sequence: 20
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade 3 (sequence 30)"
        action: "create"
        model: "school_grade"
        save_as: "grade_3"
        values:
          name: "Grade 3 Chronological"
          code: "G3CHR"
          sequence: 30
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade class for grade 1"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_1"
        values:
          name: "Class Chronological G1"
          code: "CLCHR1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade_1'].id"
      - step: "Create grade class for grade 2"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_2"
        values:
          name: "Class Chronological G2"
          code: "CLCHR2"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade_2'].id"
      - step: "Create academic year Y1 (chronologically earlier)"
        action: "create"
        model: "school_academic_year"
        save_as: "year_1"
        values:
          name: "2023/2024 Chronological"
          code: "AYCHR1"
          date_start: "2023-07-01"
          date_end: "2024-06-30"
      - step: "Create academic term for Y1 (its only term)"
        action: "create"
        model: "school_academic_term"
        save_as: "term_1"
        values:
          name: "Term Y1 Chronological"
          code: "TMCHR1"
          date_start: "2023-07-01"
          date_end: "2024-06-30"
          year_id: "EVAL: registry['year_1'].id"
      - step: "Create academic year Y2 (chronologically later)"
        action: "create"
        model: "school_academic_year"
        save_as: "year_2"
        values:
          name: "2024/2025 Chronological"
          code: "AYCHR2"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
      - step: "Create academic term for Y2 (its only term)"
        action: "create"
        model: "school_academic_term"
        save_as: "term_2"
        values:
          name: "Term Y2 Chronological"
          code: "TMCHR2"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['year_2'].id"
      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Chronological Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Chronological"
          code: "STUCHR"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step:
          "Create enrollment for Y2 first (back-fill: created first, id smaller, but
          chronologically later)"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_late"
        values:
          academic_year_id: "EVAL: registry['year_2'].id"
          academic_term_id: "EVAL: registry['term_2'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade_2'].id"
          grade_class_id: "EVAL: registry['grade_class_2'].id"
          student_id: "EVAL: registry['student'].id"
          promote_to_grade_id: "EVAL: registry['grade_3'].id"
      - step: "Force enrollment for Y2 to done"
        action: "write"
        target: "enrollment_late"
        values:
          state: "done"
      - step:
          "Create enrollment for Y1 afterwards (back-fill: created later, id larger, but
          chronologically earlier)"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_early"
        values:
          academic_year_id: "EVAL: registry['year_1'].id"
          academic_term_id: "EVAL: registry['term_1'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade_1'].id"
          grade_class_id: "EVAL: registry['grade_class_1'].id"
          student_id: "EVAL: registry['student'].id"
          promote_to_grade_id: "EVAL: registry['grade_2'].id"
      - step: "Force enrollment for Y1 to done"
        action: "write"
        target: "enrollment_early"
        values:
          state: "done"
      - step: "Invalidate student cache"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step:
          "Assert current_grade_id is grade 2 (from the chronologically latest
          enrollment, not the last-created one)"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['student'].current_grade_id.id"]
          - ["id", "=", "EVAL: registry['grade_2'].id"]
        save_as: "check_current_grade"
        expect_count: 1
      - step:
          "Assert next_grade_id is grade 3 (promoted from the chronologically latest
          enrollment)"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['student'].next_grade_id.id"]
          - ["id", "=", "EVAL: registry['grade_3'].id"]
        save_as: "check_next_grade"
        expect_count: 1

  - name:
      "Compute Next Grade From Initial Grade Unaffected By Chronological Ordering Fix"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Chronological Control"
          code: "GTCHRCTL"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Chronological Control"
          code: "SCHCHRCTL"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade 1 (sequence 10)"
        action: "create"
        model: "school_grade"
        save_as: "grade_1"
        values:
          name: "Grade 1 Chronological Control"
          code: "G1CTL"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade 2 (sequence 20)"
        action: "create"
        model: "school_grade"
        save_as: "grade_2"
        values:
          name: "Grade 2 Chronological Control"
          code: "G2CTL"
          sequence: 20
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Chronological Control Contact"
      - step: "Create student with initial_grade_id and no enrollment"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Chronological Control"
          code: "STUCHRCTL"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
          initial_grade_id: "EVAL: registry['grade_1'].id"
      - step: "Invalidate student cache"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step:
          "Assert next_grade_id is grade 2 (initial_grade_id.next_grade_id branch is
          unaffected)"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['student'].next_grade_id.id"]
          - ["id", "=", "EVAL: registry['grade_2'].id"]
        save_as: "check_next_grade"
        expect_count: 1
