        save_as: "grade_class"
        values:
          name: "Class RUYML2"
          code: "CLARUYML2"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create target student contact"
        action: "create"
        model: "res.partner"
        save_as: "target_contact"
        values:
          name: "Student Contact RUYML2TGT"

      - step: "Setup - create target student"
        action: "create"
        model: "school_student"
        save_as: "target_student"
        values:
          name: "Student RUYML2TGT"
          code: "STURUYML2TGT"
          contact_id: "REC: target_contact.id"
          school_id: "REC: school.id"

      - step: "Create target enrollment owned by admin"
        action: "create"
        model: "school_enrollment"
        save_as: "target"
        as_user: "base.user_admin"
        values:
          user_id: "REF: base.user_admin"
