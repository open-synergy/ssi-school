            expected: "draft"

      - step: "Assert the old term is unlocked again after restart"
        action: "assert"
        target: "old_term"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Setup - create source student contact"
        action: "create"
        model: "res.partner"
        save_as: "source_contact"
        values:
          name: "Student Contact RUYML2SRC"

      - step: "Setup - create source student"
