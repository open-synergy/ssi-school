      - step: "Assert the first term is paid"
        action: "assert"
        target: "term_1"
        asserts:
          state:
            type: "value"
            expected: "paid"

      - step: "Assert the aggregate is partial"
        action: "assert"
        target: "enrollment"
        asserts:
          amount_total:
            type: "value"
            expected: 1000000.0
          amount_paid:
            type: "value"
            expected: 600000.0
          amount_residual:
            type: "value"
            expected: 400000.0
          payment_status:
            type: "value"
            expected: "partial"

