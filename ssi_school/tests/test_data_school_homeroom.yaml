options:
  auto_refresh: true
scenarios:
  - name: "Create Homeroom Draft"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test"
          code: "GTHR1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 1"
          code: "AYHR1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 1"
          code: "SMHR1"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 1"
          code: "SCHHR1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 1"
          code: "G1HR1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 1"
          code: "CLAHR1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 30

      - step: "Assert homeroom created in draft"
        action: "assert"
        target: "homeroom"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          enrolled_count:
            type: "value"
            expected: 0
          seat_available:
            type: "value"
            expected: 30

  - name: "Homeroom Enrollment Relation"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test 2"
          code: "GTHR2"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 2"
          code: "AYHR2"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 2"
          code: "SMHR2"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 2"
          code: "SCHHR2"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 2"
          code: "G1HR2"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 2"
          code: "CLAHR2"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 30

      - step: "Setup - create student 1 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Student Contact Homeroom 1"
          phone: "081234500001"
          email: "hrstudent1@test.com"

      - step: "Setup - create student 1"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student Homeroom 1"
          code: "STUHR1"
          contact_id: "EVAL: registry['contact_1'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create student 2 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Student Contact Homeroom 2"
          phone: "081234500002"
          email: "hrstudent2@test.com"

      - step: "Setup - create student 2"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student Homeroom 2"
          code: "STUHR2"
          contact_id: "EVAL: registry['contact_2'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create enrollment 1 linked to homeroom"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_1"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_1'].id"
          homeroom_id: "EVAL: registry['homeroom'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Create enrollment 2 linked to homeroom"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_2"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_2'].id"
          homeroom_id: "EVAL: registry['homeroom'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Assert homeroom aggregates enrollments"
        action: "assert"
        target: "homeroom"
        asserts:
          enrollment_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
          enrolled_count:
            type: "value"
            expected: 2
          seat_available:
            type: "value"
            expected: 28

  - name: "Homeroom Full Workflow Confirm Approve Open"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test 3"
          code: "GTHR3"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 3"
          code: "AYHR3"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 3"
          code: "SMHR3"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 3"
          code: "SCHHR3"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 3"
          code: "G1HR3"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 3"
          code: "CLAHR3"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          teacher_id: false
          capacity: 30

      - step: "Assert initial state draft"
        action: "assert"
        target: "homeroom"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm homeroom"
        action: "call"
        target: "homeroom"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve homeroom"
        action: "call"
        target: "homeroom"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert sequence generated on open"
        action: "assert"
        target: "homeroom"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "SH"
