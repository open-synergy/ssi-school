options:
  auto_refresh: true
scenarios:
  - name: "Create Homeroom Draft"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test"
          code: "GTHR1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 1"
          code: "AYHR1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 1"
          code: "SMHR1"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 1"
          code: "SCHHR1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 1"
          code: "G1HR1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 1"
          code: "CLAHR1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 30

      - step: "Assert homeroom created in draft"
        action: "assert"
        target: "homeroom"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          enrolled_count:
            type: "value"
            expected: 0
          seat_available:
            type: "value"
            expected: 30

  - name: "Homeroom Enrollment Relation"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test 2"
          code: "GTHR2"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 2"
          code: "AYHR2"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 2"
          code: "SMHR2"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 2"
          code: "SCHHR2"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 2"
          code: "G1HR2"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 2"
          code: "CLAHR2"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 30

      - step: "Setup - create student 1 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Student Contact Homeroom 1"
          phone: "081234500001"
          email: "hrstudent1@test.com"

      - step: "Setup - create student 1"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student Homeroom 1"
          code: "STUHR1"
          contact_id: "EVAL: registry['contact_1'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create student 2 contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Student Contact Homeroom 2"
          phone: "081234500002"
          email: "hrstudent2@test.com"

      - step: "Setup - create student 2"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student Homeroom 2"
          code: "STUHR2"
          contact_id: "EVAL: registry['contact_2'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create enrollment 1 linked to homeroom"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_1"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_1'].id"
          homeroom_id: "EVAL: registry['homeroom'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Create enrollment 2 linked to homeroom"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment_2"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student_2'].id"
          homeroom_id: "EVAL: registry['homeroom'].id"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Assert homeroom aggregates enrollments"
        action: "assert"
        target: "homeroom"
        asserts:
          enrollment_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
          enrolled_count:
            type: "value"
            expected: 2
          seat_available:
            type: "value"
            expected: 28

  - name: "Homeroom Full Workflow Confirm Approve Open"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Homeroom Test 3"
          code: "GTHR3"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Homeroom Test 3"
          code: "AYHR3"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom Test 3"
          code: "SMHR3"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Homeroom Test 3"
          code: "SCHHR3"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 for Homeroom 3"
          code: "G1HR3"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class A Homeroom 3"
          code: "CLAHR3"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          teacher_id: false
          capacity: 30

      - step: "Assert initial state draft"
        action: "assert"
        target: "homeroom"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm homeroom"
        action: "call"
        target: "homeroom"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Assert homeroom is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "homeroom"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve homeroom"
        action: "call"
        target: "homeroom"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert sequence generated on open"
        action: "assert"
        target: "homeroom"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "SH"

  - name: "Onchange Grade Class Fills Capacity"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Homeroom Onchange"
          code: "GTHRO"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Homeroom Onchange"
          code: "SCHHRO"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Homeroom Onchange"
          code: "GHRO"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class with capacity 25"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class Homeroom Onchange"
          code: "CLHRO"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          capacity: 25

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Homeroom Onchange"
          code: "AYHRO"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Term Homeroom Onchange"
          code: "TMHRO"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Selecting the grade class fills the capacity on the form"
        action: form
        model: "school_homeroom"
        save: false
        ops:
          - set:
              academic_year_id: "REC: academic_year"
          - set:
              academic_term_id: "REC: academic_term"
          - set:
              school_id: "REC: school"
          - set:
              grade_id: "REC: grade"
          - set:
              grade_class_id: "REC: grade_class"
          - assert:
              capacity:
                type: "value"
                expected: 25

  - name: "Fill Random Only Picks Allowed Students"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Fill Random 1"
          code: "GTFR1"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Fill Random 1"
          code: "SCHFR1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create another school"
        action: "create"
        model: "school"
        save_as: "other_school"
        values:
          name: "Other School Fill Random 1"
          code: "SCHFR1B"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Fill Random 1"
          code: "GFR1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create another grade"
        action: "create"
        model: "school_grade"
        save_as: "other_grade"
        values:
          name: "Other Grade Fill Random 1"
          code: "GFR1B"
          sequence: 20
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class Fill Random 1"
          code: "CLFR1"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          capacity: 50

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year Fill Random 1"
          code: "AYFR1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create first academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "term_1"
        values:
          name: "Term 1 Fill Random 1"
          code: "TMFR1A"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "REC: academic_year.id"

      - step: "Setup - create second academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "term_2"
        values:
          name: "Term 2 Fill Random 1"
          code: "TMFR1B"
          date_start: "2025-01-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"

      - step: "Assert the first term opens the academic year"
        action: "assert"
        target: "term_1"
        asserts:
          first_term:
            type: "value"
            operator: "is_truthy"

      - step: "Assert the second term does not open the academic year"
        action: "assert"
        target: "term_2"
        asserts:
          first_term:
            type: "value"
            operator: "is_falsy"

      - step: "Setup - create contact of allowed student 1"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Contact STUFR1A"

      - step: "Setup - create allowed student 1"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student STUFR1A"
          code: "STUFR1A"
          contact_id: "REC: contact_1.id"
          school_id: "REC: school.id"
          initial_grade_id: "REC: grade.id"

      - step: "Setup - create contact of allowed student 2"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Contact STUFR1B"

      - step: "Setup - create allowed student 2"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student STUFR1B"
          code: "STUFR1B"
          contact_id: "REC: contact_2.id"
          school_id: "REC: school.id"
          initial_grade_id: "REC: grade.id"

      - step: "Setup - create contact of allowed student 3"
        action: "create"
        model: "res.partner"
        save_as: "contact_3"
        values:
          name: "Contact STUFR1C"

      - step: "Setup - create allowed student 3"
        action: "create"
        model: "school_student"
        save_as: "student_3"
        values:
          name: "Student STUFR1C"
          code: "STUFR1C"
          contact_id: "REC: contact_3.id"
          school_id: "REC: school.id"
          initial_grade_id: "REC: grade.id"

      - step: "Setup - create contact of the non draft student"
        action: "create"
        model: "res.partner"
        save_as: "contact_4"
        values:
          name: "Contact STUFR1D"

      - step: "Setup - create the non draft student"
        action: "create"
        model: "school_student"
        save_as: "non_draft_student"
        values:
          name: "Student STUFR1D"
          code: "STUFR1D"
          contact_id: "REC: contact_4.id"
          school_id: "REC: school.id"
          initial_grade_id: "REC: grade.id"

      - step: "Setup - move the non draft student out of draft"
        action: "write"
        target: "non_draft_student"
        values:
          state: "enrol"

      - step: "Setup - create contact of the other school student"
        action: "create"
        model: "res.partner"
        save_as: "contact_5"
        values:
          name: "Contact STUFR1E"

      - step: "Setup - create the other school student"
        action: "create"
        model: "school_student"
        save_as: "other_school_student"
        values:
          name: "Student STUFR1E"
          code: "STUFR1E"
          contact_id: "REC: contact_5.id"
          school_id: "REC: other_school.id"
          initial_grade_id: "REC: grade.id"

      - step: "Setup - create contact of the other grade student"
        action: "create"
        model: "res.partner"
        save_as: "contact_6"
        values:
          name: "Contact STUFR1F"

      - step: "Setup - create the other grade student"
        action: "create"
        model: "school_student"
        save_as: "other_grade_student"
        values:
          name: "Student STUFR1F"
          code: "STUFR1F"
          contact_id: "REC: contact_6.id"
          school_id: "REC: school.id"
          initial_grade_id: "REC: other_grade.id"

      - step: "Create homeroom on the second term"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2025-01-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: term_2.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          capacity: 50

      - step: "Fill random candidates"
        action: "call"
        target: "homeroom"
        method: "action_fill_random"

      - step: "Assert the candidates are exactly the three allowed students"
        action: "assert"
        target: "homeroom"
        asserts:
          candidate_student_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: student_1"
              - "REC: student_2"
              - "REC: student_3"

      - step: "Assert the non draft student was not picked"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "REC: non_draft_student.id"]
          - ["id", "in", "REC: homeroom.candidate_student_ids.ids"]
        save_as: "picked_non_draft_student"
        expect_count: 0

      - step: "Assert the other school student was not picked"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "REC: other_school_student.id"]
          - ["id", "in", "REC: homeroom.candidate_student_ids.ids"]
        save_as: "picked_other_school_student"
        expect_count: 0

      - step: "Assert the other grade student was not picked"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "REC: other_grade_student.id"]
          - ["id", "in", "REC: homeroom.candidate_student_ids.ids"]
        save_as: "picked_other_grade_student"
        expect_count: 0

  - name: "Fill Random On First Term Uses Next Grade"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Fill Random 2"
          code: "GTFR2"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Fill Random 2"
          code: "SCHFR2"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create the previous grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_prev"
        values:
          name: "Grade Prev Fill Random 2"
          code: "GFR2A"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create the target grade"
        action: "create"
        model: "school_grade"
        save_as: "grade_target"
        values:
          name: "Grade Target Fill Random 2"
          code: "GFR2B"
          sequence: 20
          type_id: "REC: grade_type.id"

      - step: "Assert the target grade follows the previous grade"
        action: "assert"
        target: "grade_prev"
        asserts:
          next_grade_id:
            type: "m2o"
            expected: "REC: grade_target"

      - step: "Setup - create grade class on the target grade"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class Fill Random 2"
          code: "CLFR2"
          school_id: "REC: school.id"
          grade_id: "REC: grade_target.id"
          capacity: 50

      - step: "Setup - create academic year"
