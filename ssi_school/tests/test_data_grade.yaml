scenarios:
  - name: "Create Grade"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Grade Test"
          code: "GTGT"
          sequence: 10
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 3"
          code: "G3"
          sequence: 30
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Assert created"
        action: "assert"
        target: "grade"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Grade 3"
          type_id:
            type: "value"
            operator: "is_truthy"

  - name: "Edit Grade Name"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Edit Grade"
          code: "GTEG"
          sequence: 10
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1"
          code: "G1ED"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Write new name"
        action: "write"
        target: "grade"
        values:
          name: "Grade 1 Updated"
      - step: "Assert name updated"
        action: "assert"
        target: "grade"
        asserts:
          name:
            type: "value"
            expected: "Grade 1 Updated"

  - name: "Edit Grade Sequence"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Seq"
          code: "GTSEQ"
          sequence: 10
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade 1 Seq"
          code: "G1SEQ"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Update sequence"
        action: "write"
        target: "grade"
        values:
          sequence: 15
      - step: "Assert sequence updated"
        action: "assert"
        target: "grade"
        asserts:
          sequence:
            type: "value"
            expected: 15

  - name: "Delete Grade"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Del Grade"
          code: "GTDG"
          sequence: 10
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade To Delete"
          code: "GDEL"
          sequence: 99
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Delete grade"
        action: "call"
        target: "grade"
        method: "unlink"
      - step: "Search expects zero results"
        action: "search"
        model: "school_grade"
        domain: [["code", "=", "GDEL"]]
        save_as: "result"
        expect_count: 0

  - name: "Compute Next Previous Grade"
    steps:
      - step: "Create grade type for sequence test"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Sequence Test"
          code: "GTST2"
          sequence: 100
      - step: "Create grade A (sequence 10)"
        action: "create"
        model: "school_grade"
        save_as: "grade_a"
        values:
          name: "Seq Grade A"
          code: "SGA"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade B (sequence 20)"
        action: "create"
        model: "school_grade"
        save_as: "grade_b"
        values:
          name: "Seq Grade B"
          code: "SGB"
          sequence: 20
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Invalidate grade caches"
        action: "call"
        target: "grade_a"
        method: "invalidate_cache"
      - step: "Assert grade_b has previous_grade_id"
        action: "call"
        target: "grade_b"
        method: "invalidate_cache"
        asserts:
          previous_grade_id:
            type: "value"
            operator: "is_truthy"

  - name: "Grade Chain Scoped Per Grade Type"
    steps:
      - step: "Create elementary grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "type_elementary"
        values:
          name: "Elementary Scope Test"
          code: "ELSC"
          sequence: 10
      - step: "Create junior high grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "type_junior"
        values:
          name: "Junior High Scope Test"
          code: "JHSC"
          sequence: 20
      - step: "Create elementary grade 1"
        action: "create"
        model: "school_grade"
        save_as: "el_grade_1"
        values:
          name: "Elementary Grade 1"
          code: "ELG1"
          sequence: 10
          type_id: "EVAL: registry['type_elementary'].id"
      - step: "Create elementary grade 2 (last of elementary)"
        action: "create"
        model: "school_grade"
        save_as: "el_grade_2"
        values:
          name: "Elementary Grade 2"
          code: "ELG2"
          sequence: 20
          type_id: "EVAL: registry['type_elementary'].id"
      - step: "Create junior high grade 1 (first of junior high)"
        action: "create"
        model: "school_grade"
        save_as: "jh_grade_1"
        values:
          name: "Junior High Grade 1"
          code: "JHG1"
          sequence: 10
          type_id: "EVAL: registry['type_junior'].id"
      - step: "Invalidate cache on elementary grade 1"
        action: "call"
        target: "el_grade_1"
        method: "invalidate_cache"
      - step: "Invalidate cache on elementary grade 2"
        action: "call"
        target: "el_grade_2"
        method: "invalidate_cache"
      - step: "Invalidate cache on junior high grade 1"
        action: "call"
        target: "jh_grade_1"
        method: "invalidate_cache"
      - step:
          "Assert last elementary grade has no next grade (does not cross into junior
          high)"
        action: "assert"
        target: "el_grade_2"
        asserts:
          next_grade_id:
            type: "value"
            operator: "is_falsy"
      - step:
          "Assert first junior high grade has no previous grade (does not cross into
          elementary)"
        action: "assert"
        target: "jh_grade_1"
        asserts:
          previous_grade_id:
            type: "value"
            operator: "is_falsy"
      - step: "Assert elementary grade 1 next grade is elementary grade 2"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['el_grade_1'].next_grade_id.id"]
          - ["id", "=", "EVAL: registry['el_grade_2'].id"]
        save_as: "check_el_next"
        expect_count: 1
      - step: "Assert elementary grade 2 previous grade is elementary grade 1"
        action: "search"
        model: "school_grade"
        domain:
          - ["id", "=", "EVAL: registry['el_grade_2'].previous_grade_id.id"]
          - ["id", "=", "EVAL: registry['el_grade_1'].id"]
        save_as: "check_el_prev"
        expect_count: 1
