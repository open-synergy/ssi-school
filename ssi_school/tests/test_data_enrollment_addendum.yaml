options:
  auto_refresh: true
scenarios:
  - name: "Addendum - Existing Payment Term Is Locked After Enrollment Opens"
    steps:
      - step: "Setup - get customer invoice journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable ADDCI01"
          code: "ADDCI01"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type ADDCI01"
          code: "ADDCI01"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - get receivable journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "receivable_journal"
        limit: 1

      - step: "Setup - get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "School Fee Income ADDEN1"
          code: "ADDEN14200"
          user_type_id: "EVAL: registry['account_type'].id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee ADDEN1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "Pricelist ADDEN1"
          currency_id: "EVAL: env.company.currency_id.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type ADDEN1"
          code: "GTADDEN1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 ADDEN1"
          code: "AYADDEN1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester ADDEN1"
          code: "SMADDEN1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School ADDEN1"
          code: "SCHADDEN1"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade ADDEN1"
          code: "GADDEN1"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class ADDEN1"
          code: "CLAADDEN1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact ADDEN1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student ADDEN1"
          code: "STUADDEN1"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create payment template"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "payment_template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "Payment Template ADDEN1"
          code: "PMTADDEN1"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          term_ids:
            - - 0
              - 0
              - name: "Term 1 ADDEN1"
                sequence: 10
                detail_ids:
                  - - 0
                    - 0
                    - product_id: "EVAL: registry['product'].id"
                      name: "Fee ADDEN1"
                      account_id: "EVAL: registry['account'].id"
                      uom_quantity: 1.0
                      uom_id: "REF: uom.product_uom_unit"
                      price_unit: 1000000.0

      - step: "Create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        as_user: "base.user_admin"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student'].id"
          payment_template_id: "EVAL: registry['payment_template'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "EVAL: env.company.currency_id.id"
          receivable_journal_id: "EVAL: registry['receivable_journal'].id"

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Compute payment"
        action: "call"
        target: "enrollment"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Get payment term before opening"
        action: "search"
        model: "school_enrollment_payment_term"
        domain: [["enrollment_id", "=", "EVAL: registry['enrollment'].id"]]
        save_as: "term"
        expect_count: 1

      - step: "Assert term not locked before opening"
        action: "assert"
        target: "term"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Get payment term detail before opening"
        action: "search"
        model: "school_enrollment_payment_term_detail"
        domain: [["term_id", "=", "EVAL: registry['term'].id"]]
        save_as: "detail"
        expect_count: 1

      - step: "Assert detail not locked before opening"
        action: "assert"
        target: "detail"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Assert enrollment is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert term locked after opening"
        action: "assert"
        target: "term"
        asserts:
          locked:
            type: "value"
            expected: true

      - step: "Assert detail locked after opening"
        action: "assert"
        target: "detail"
        asserts:
          locked:
            type: "value"
            expected: true

      - step: "Addendum - add a new payment term while open"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "addendum_term"
        as_user: "base.user_admin"
        values:
          enrollment_id: "EVAL: registry['enrollment'].id"
          name: "Addendum Term ADDEN1"
          sequence: 20

      - step: "Assert new addendum term is not locked"
        action: "assert"
        target: "addendum_term"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Addendum - add a new detail line to the existing locked term"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "addendum_detail"
        as_user: "base.user_admin"
        values:
          term_id: "EVAL: registry['term'].id"
          product_id: "EVAL: registry['product'].id"
          name: "Addendum Fee ADDEN1"
          account_id: "EVAL: registry['account'].id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 250000.0

      - step: "Assert new addendum detail is not locked"
        action: "assert"
        target: "addendum_detail"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Close addendum (first round)"
        action: "call"
        target: "enrollment"
        method: "action_close_addendum"
        as_user: "base.user_admin"

      - step: "Assert first-round addendum term is locked after closing"
        action: "assert"
        target: "addendum_term"
        asserts:
          locked:
            type: "value"
            expected: true

      - step: "Assert first-round addendum detail is locked after closing"
        action: "assert"
        target: "addendum_detail"
        asserts:
          locked:
            type: "value"
            expected: true

      - step: "Addendum can happen again - add a second-round term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "addendum_term_2"
        as_user: "base.user_admin"
        values:
          enrollment_id: "EVAL: registry['enrollment'].id"
          name: "Addendum Term 2 ADDEN1"
          sequence: 30

      - step: "Assert second-round addendum term is not locked yet"
        action: "assert"
        target: "addendum_term_2"
        asserts:
          locked:
            type: "value"
            expected: false

      - step: "Close addendum (second round)"
        action: "call"
        target: "enrollment"
        method: "action_close_addendum"
        as_user: "base.user_admin"

      - step: "Assert second-round addendum term is locked after closing again"
        action: "assert"
        target: "addendum_term_2"
        asserts:
          locked:
            type: "value"
            expected: true

