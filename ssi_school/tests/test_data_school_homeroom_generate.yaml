        save_as: "grade"
        values:
          name: "Grade 1 Homeroom Generate 2"
          code: "G1HG2"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create other grade"
        action: "create"
        model: "school_grade"
