      - step: "Setup - create contact 2"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Contact Homeroom Generate 4-2"

      - step: "Setup - create student 2"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student Homeroom Generate 4-2"
          code: "STUHG42"
          contact_id: "EVAL: registry['contact_2'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create homeroom"
        action: "create"
