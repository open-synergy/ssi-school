          capacity: 30

      - step: "Setup - create contact for eligible student"
        action: "create"
        model: "res.partner"
        save_as: "eligible_contact"
        values:
          name: "Eligible Contact Homeroom Generate 2"

      - step: "Setup - create eligible student (current_grade_id = grade)"
        action: "create"
        model: "school_student"
        save_as: "eligible_student"
        values:
          name: "Eligible Student Homeroom Generate 2"
          code: "STUHG2E"
          contact_id: "EVAL: registry['eligible_contact'].id"
          school_id: "EVAL: registry['school'].id"
          initial_grade_id: "EVAL: registry['grade'].id"

      - step: "Setup - create contact for non eligible student"
        action: "create"
        model: "res.partner"
        save_as: "non_eligible_contact"
        values:
          name: "Non Eligible Contact Homeroom Generate 2"

      - step:
          "Setup - create non eligible student (next_grade_id = grade, current != grade)"
        action: "create"
        model: "school_student"
        save_as: "non_eligible_student"
        values:
          name: "Non Eligible Student Homeroom Generate 2"
          code: "STUHG2N"
          contact_id: "EVAL: registry['non_eligible_contact'].id"
          school_id: "EVAL: registry['school'].id"
          initial_grade_id: "EVAL: registry['other_grade'].id"

      - step: "Create homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2025-01-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 2

      - step: "Assert exactly one allowed student"
        action: "assert"
        target: "homeroom"
        asserts:
          allowed_student_ids:
            type: "m2m"
            check: "count"
            expected_count: 1

      - step: "Search allowed students to confirm eligible student is present"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "EVAL: registry['eligible_student'].id"]
          - ["id", "in", "EVAL: registry['homeroom'].allowed_student_ids.ids"]
        save_as: "found_eligible"
        expect_count: 1

      - step: "Search allowed students to confirm non-eligible student is absent"
        action: "search"
        model: "school_student"
        domain:
          - ["id", "=", "EVAL: registry['non_eligible_student'].id"]
          - ["id", "in", "EVAL: registry['homeroom'].allowed_student_ids.ids"]
        save_as: "found_non_eligible"
        expect_count: 0

