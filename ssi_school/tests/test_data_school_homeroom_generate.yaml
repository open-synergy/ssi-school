          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 5

      - step: "Confirm homeroom"
        action: "call"
        target: "homeroom"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate homeroom cache before approve"
        action: "call"
        target: "homeroom"
        method: "invalidate_cache"

      - step: "Approve homeroom"
        action: "call"
        target: "homeroom"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Select both students as candidates"
        action: "write"
        target: "homeroom"
        values:
          candidate_student_ids:
            - - 6
              - 0
              - - "EVAL: registry['student_1'].id"
                - "EVAL: registry['student_2'].id"

      - step: "Generate enrollments for both candidates"
        action: "call"
        target: "homeroom"
        method: "action_generate_enrollments"
        context:
          queue_job__no_delay: true

      - step: "Search generated enrollments (expect 2)"
        action: "search"
        model: "school_enrollment"
        domain: [["homeroom_id", "=", "EVAL: registry['homeroom'].id"]]
        save_as: "enrollments_before_reconcile"
        expect_count: 2

      - step: "Unselect student 2, keeping only student 1 as candidate"
        action: "write"
        target: "homeroom"
        values:
          candidate_student_ids:
            - - 6
              - 0
              - - "EVAL: registry['student_1'].id"

      - step: "Regenerate to reconcile enrollments with candidates"
        action: "call"
        target: "homeroom"
        method: "action_generate_enrollments"
        context:
          queue_job__no_delay: true

      - step: "Search enrollment for student 2 (expect removed)"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["homeroom_id", "=", "EVAL: registry['homeroom'].id"]
          - ["student_id", "=", "EVAL: registry['student_2'].id"]
        save_as: "enrollment_student_2_after_reconcile"
        expect_count: 0

      - step: "Search all enrollments after reconcile (expect only student 1's)"
        action: "search"
        model: "school_enrollment"
        domain: [["homeroom_id", "=", "EVAL: registry['homeroom'].id"]]
        save_as: "enrollments_after_reconcile"
        expect_count: 1

  - name:
      "Homeroom Generate Enrollment Copies Receivable Journal And Account From Default
