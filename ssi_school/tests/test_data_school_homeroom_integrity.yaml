options:
  auto_refresh: true

setup:
  steps:
    - step: "Setup - create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "Grade Type Homeroom Integrity"
        code: "GTHRI"
        sequence: 10

    - step: "Setup - create school"
      action: "create"
      model: "school"
      save_as: "school"
      values:
        name: "School Homeroom Integrity"
        code: "SCHHRI"
        grade_type_id: "REC: grade_type.id"

    - step: "Setup - create the other school"
      action: "create"
      model: "school"
      save_as: "other_school"
      values:
        name: "Other School Homeroom Integrity"
        code: "SCHHRI2"
        grade_type_id: "REC: grade_type.id"

    - step: "Setup - create grade"
      action: "create"
      model: "school_grade"
      save_as: "grade"
      values:
        name: "Grade Homeroom Integrity"
        code: "GHRI"
        sequence: 10
        type_id: "REC: grade_type.id"

    - step: "Setup - create the grade of the other school"
      action: "create"
      model: "school_grade"
      save_as: "other_school_grade"
      values:
        name: "Grade Other School Homeroom Integrity"
        code: "GHRI2"
        sequence: 20
        type_id: "REC: grade_type.id"

    - step: "Setup - create grade class"
      action: "create"
      model: "school_grade_class"
      save_as: "grade_class"
      values:
        name: "Class Homeroom Integrity"
        code: "CLHRI"
        school_id: "REC: school.id"
        grade_id: "REC: grade.id"
        capacity: 30

    - step: "Setup - create the grade class of the other school"
      action: "create"
      model: "school_grade_class"
      save_as: "other_grade_class"
      values:
        name: "Class Other School Homeroom Integrity"
        code: "CLHRI2"
        school_id: "REC: other_school.id"
        grade_id: "REC: other_school_grade.id"
        capacity: 30

    - step: "Setup - create academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "year"
      values:
        name: "Year Homeroom Integrity"
        code: "AYHRI"
        date_start: "2024-07-01"
        date_end: "2025-06-30"

    - step: "Setup - create the other academic year"
      action: "create"
      model: "school_academic_year"
      save_as: "other_year"
      values:
        name: "Other Year Homeroom Integrity"
        code: "AYHRI2"
        date_start: "2025-07-01"
        date_end: "2026-06-30"

    - step: "Setup - create academic term of the first year"
      action: "create"
      model: "school_academic_term"
      save_as: "term"
      values:
        name: "Term Homeroom Integrity"
        code: "TMHRI"
        date_start: "2024-07-01"
        date_end: "2024-12-31"
        year_id: "REC: year.id"
        enrollment_state: "open"

scenarios:
  - name: "Fully consistent homeroom data is accepted"
    steps:
      - step: "Create the consistent homeroom"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: year.id"
          academic_term_id: "REC: term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          capacity: 30

      - step: "Assert the homeroom is created in draft"
        action: "assert"
        target: "homeroom"
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "Homeroom whose term is from another year is rejected"
    steps:
      - step: "Create the homeroom on a year that does not own the term"
        action: "create"
        model: "school_homeroom"
        expect_error:
          type: "ValidationError"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: other_year.id"
          academic_term_id: "REC: term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          capacity: 30

  - name: "Homeroom whose class is from another school is rejected"
    steps:
      - step: "Create the homeroom on the class of the other school"
        action: "create"
        model: "school_homeroom"
        expect_error:
          type: "ValidationError"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: year.id"
          academic_term_id: "REC: term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: other_grade_class.id"
          capacity: 30
