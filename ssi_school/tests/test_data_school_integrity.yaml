options:
  auto_refresh: true

setup:
  steps:
    - step: "Setup - create grade type"
      action: "create"
      model: "school_grade_type"
      save_as: "grade_type"
      values:
        name: "Grade Type Integrity"
        code: "GTSCHINT"
        sequence: 10

    - step: "Setup - create the other center"
      action: "create"
      model: "res.company"
      save_as: "other_company"
      values:
        name: "Other Center Integrity"

    - step: "Setup - create a branch of the current center"
      action: "create"
      model: "school_branch"
      save_as: "branch"
      values:
        name: "Branch Integrity"
        code: "BRSCHINT"
        company_id: "REC: company.id"

    - step: "Setup - create a branch of the other center"
      action: "create"
      model: "school_branch"
      save_as: "other_branch"
      values:
        name: "Other Center Branch Integrity"
        code: "BRSCHINT2"
        company_id: "REC: other_company.id"

scenarios:
  - name: "School with a branch of its own center is accepted"
    steps:
      - step: "Create the school on the matching branch"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Integrity"
          code: "SCHBRINT"
          grade_type_id: "REC: grade_type.id"
          branch_id: "REC: branch.id"

      - step: "Assert the branch is the one that was set"
        action: "assert"
        target: "school"
        asserts:
          branch_id:
            type: "m2o"
            expected: "REC: branch"

  - name: "School on a branch of another center is rejected on create"
    steps:
      - step: "Create the school on the branch of the other center"
        action: "create"
        model: "school"
        expect_error:
          type: "ValidationError"
        values:
          name: "School Integrity"
          code: "SCHBRINT"
          grade_type_id: "REC: grade_type.id"
          branch_id: "REC: other_branch.id"

  - name: "School moved to a branch of another center is rejected"
    steps:
      - step: "Create the school without any branch"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Integrity"
          code: "SCHBRINT"
          grade_type_id: "REC: grade_type.id"

      - step: "Write the branch of the other center on that school"
        action: "write"
        target: "school"
        expect_error:
          type: "ValidationError"
        values:
          branch_id: "REC: other_branch.id"
