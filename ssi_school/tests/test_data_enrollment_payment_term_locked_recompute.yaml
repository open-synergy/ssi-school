        action: "assert"
        target: "term"
        asserts:
          locked:
            type: "value"
            expected: true

      - step:
          "Mixed write combining the whitelisted state field with name (outside
          ADDENDUM_LOCK_ALLOWED_FIELDS) must still be rejected on a locked term"
        action: "write"
        target: "term"
        values:
          state: "manual"
          name: "Renamed Term PTLR2"
        expect_error:
          type: "UserError"
          message_contains: "is locked and cannot be modified"
