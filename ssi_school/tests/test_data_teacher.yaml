scenarios:
  - name: "Create Teacher"
    steps:
      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "New Teacher Home Address"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "New Teacher Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "New Teacher"
          code: "TCH002"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Assert created"
        action: "assert"
        target: "teacher"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "New Teacher"
          employee_id:
            type: "value"
            operator: "is_truthy"

  - name: "Edit Teacher Name"
    steps:
      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Teacher Home Address Edit"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Teacher Employee Edit"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher 1"
          code: "TCH001ED"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Write new name"
        action: "write"
        target: "teacher"
        values:
          name: "Teacher 1 Updated"
      - step: "Assert name updated"
        action: "assert"
        target: "teacher"
        asserts:
          name:
            type: "value"
            expected: "Teacher 1 Updated"

  - name: "Edit Teacher Employee"
    steps:
      - step: "Create first home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_1"
        values:
          name: "Teacher Original Home Address"
      - step: "Create first employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_1"
        values:
          name: "Teacher Original Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner_1'].id"
      - step: "Create second home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner_2"
        values:
          name: "Another Teacher Home Address"
      - step: "Create second employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_2"
        values:
          name: "Another Teacher Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner_2'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher Edit Employee"
          code: "TCHEC"
          employee_id: "EVAL: registry['employee_1'].id"
      - step: "Update employee"
        action: "write"
        target: "teacher"
        values:
          employee_id: "EVAL: registry['employee_2'].id"
      - step: "Verify employee was updated"
        action: "search"
        model: "school_teacher"
        domain:
          [
            ["id", "=", "EVAL: registry['teacher'].id"],
            ["employee_id", "=", "EVAL: registry['employee_2'].id"],
          ]
        save_as: "_check"
        expect_count: 1

  - name: "Delete Teacher"
    steps:
      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Teacher To Delete Home Address"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Teacher To Delete Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher To Delete"
          code: "TCHDEL"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Delete teacher"
        action: "call"
        target: "teacher"
        method: "unlink"
      - step: "Search expects zero results"
        action: "search"
        model: "school_teacher"
        domain: [["code", "=", "TCHDEL"]]
        save_as: "result"
        expect_count: 0

  - name: "Related Fields From Home Address"
    steps:
      - step: "Create home address partner with phone and email"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Teacher Related Home Address"
          phone: "081234567890"
          email: "teacher@test.com"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Teacher Related Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher Related"
          code: "TCHREL"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Assert phone and email are from home address"
        action: "assert"
        target: "teacher"
        asserts:
          phone:
            type: "value"
            expected: "081234567890"
          email:
            type: "value"
            expected: "teacher@test.com"

  - name: "Personal Information From Home Address"
    steps:
      - step: "Create home address partner with personal information"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Teacher Personal Home Address"
          gender: "male"
          birthdate_date: 1985-05-17
          birth_city: "Bandung"
          blood_type: "0"
          marital: "married"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Teacher Personal Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher Personal"
          code: "TCHPRS"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Assert personal information from home address"
        action: "assert"
        target: "teacher"
        asserts:
          gender:
            type: "value"
            expected: "male"
          birthdate_date:
            type: "value"
            expected: 1985-05-17
          birth_city:
            type: "value"
            expected: "Bandung"
          blood_type:
            type: "value"
            expected: "0"
          marital:
            type: "value"
            expected: "married"

  - name: "Write Back To Home Address"
    steps:
      - step: "Create home address partner"
        action: "create"
        model: "res.partner"
        save_as: "partner"
        values:
          name: "Teacher Write Back Home Address"
          street: "Old Street"
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Teacher Write Back Employee"
          company_id: "base.main_company"
          address_home_id: "EVAL: registry['partner'].id"
      - step: "Create teacher"
        action: "create"
        model: "school_teacher"
        save_as: "teacher"
        values:
          name: "Teacher Write Back"
          code: "TCHWB"
          employee_id: "EVAL: registry['employee'].id"
      - step: "Write street on teacher"
        action: "write"
        target: "teacher"
        values:
          street: "New Street 123"
      - step: "Verify home address partner street was updated"
        action: "search"
        model: "res.partner"
        domain:
          [
            ["id", "=", "EVAL: registry['partner'].id"],
            ["street", "=", "New Street 123"],
          ]
        save_as: "_check"
        expect_count: 1
