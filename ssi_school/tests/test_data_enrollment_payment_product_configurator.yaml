        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type CFG Enr Manual"
          code: "GTCFGENRMAN"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School CFG Enr Manual"
          code: "SCHCFGENRMAN"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade CFG Enr Manual"
          code: "GCFGENRMAN"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class CFG Enr Manual"
          code: "CLACFGENRMAN"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 CFG Enr Manual"
          code: "AYCFGENRMAN"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
      - step: "Create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester CFG Enr Manual"
          code: "SMCFGENRMAN"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"
      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact CFG Enr Manual"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student CFG Enr Manual"
          code: "STUCFGENRMAN"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"
      - step: "Create payment template with manual product selection"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "payment_template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "Template CFG Enr Manual"
          code: "TPLCFGENRMAN"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          product_selection_method: "manual"
          product_ids:
            - - 6
              - 0
              - - "EVAL: registry['product_allowed_1'].id"
                - "EVAL: registry['product_allowed_2'].id"
          term_ids:
            - - 0
              - 0
              - name: "Term 1 CFG Enr Manual"
                sequence: 10
                detail_ids:
                  - - 0
                    - 0
                    - product_id: "EVAL: registry['product_allowed_1'].id"
                      name: "Fee CFG Enr Manual"
                      account_id: "EVAL: registry['account'].id"
                      uom_quantity: 1.0
                      uom_id: "REF: uom.product_uom_unit"
                      price_unit: 100000.0
      - step: "Create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student'].id"
          payment_template_id: "EVAL: registry['payment_template'].id"
          pricelist_id: "EVAL: registry['pricelist'].id"
          currency_id: "EVAL: env.company.currency_id.id"
          receivable_journal_id: "EVAL: registry['receivable_journal'].id"
      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Compute payment"
        action: "call"
        target: "enrollment"
        method: "action_compute_payment"
        as_user: "base.user_admin"
      - step: "Get enrollment payment term detail"
        action: "search"
        model: "school_enrollment_payment_term_detail"
        domain: [["term_id.enrollment_id", "=", "EVAL: registry['enrollment'].id"]]
        save_as: "detail"
        expect_count: 1
      - step: "Assert allowed_product_ids has the two manually selected products"
        action: "assert"
        target: "detail"
        asserts:
          allowed_product_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

