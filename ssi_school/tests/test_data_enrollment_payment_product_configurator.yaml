options:
  auto_refresh: true
scenarios:
  - name: "Allowed Products - Template Detail - Manual Strategy"
    steps:
      - step: "Setup - get customer invoice journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable PPCCI01"
          code: "PPCCI01"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type PPCCI01"
          code: "PPCCI01"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"
      - step: "Create account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Income Account CFG Manual"
          code: "CFGMAN4200"
          user_type_id: "EVAL: registry['account_type'].id"
      - step: "Create allowed product 1"
        action: "create"
        model: "product.product"
        save_as: "product_allowed_1"
        values:
          name: "Allowed Product CFG Manual 1"
          type: "service"
      - step: "Create allowed product 2"
        action: "create"
        model: "product.product"
        save_as: "product_allowed_2"
        values:
          name: "Allowed Product CFG Manual 2"
          type: "service"
      - step: "Create disallowed product"
        action: "create"
        model: "product.product"
        save_as: "product_disallowed"
        values:
          name: "Disallowed Product CFG Manual"
          type: "service"
      - step: "Create payment template with manual product selection"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "Template CFG Manual"
          code: "TPLCFGMAN"
          product_selection_method: "manual"
          product_ids:
            - - 6
              - 0
              - - "EVAL: registry['product_allowed_1'].id"
                - "EVAL: registry['product_allowed_2'].id"
      - step: "Create term"
        action: "create"
        model: "school_enrollment_payment_template.term"
        save_as: "term"
        values:
          name: "Term CFG Manual"
          sequence: 10
          template_id: "EVAL: registry['template'].id"
      - step: "Create term detail"
        action: "create"
        model: "school_enrollment_payment_template.term.detail"
        save_as: "detail"
        values:
          term_id: "EVAL: registry['term'].id"
          sequence: 10
          product_id: "EVAL: registry['product_allowed_1'].id"
          name: "Fee CFG Manual"
          account_id: "EVAL: registry['account'].id"
          uom_quantity: 1.0
          price_unit: 100000.0
      - step: "Assert allowed_product_ids has the two manually selected products"
        action: "assert"
        target: "detail"
        asserts:
          allowed_product_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

