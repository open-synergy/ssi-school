options:
  auto_refresh: true
scenarios:
  - name: Fully consistent enrollment data is accepted
    steps:
      - step: Setup - create grade type (s1)
        action: create
        model: school_grade_type
        save_as: grade_type
        values:
          name: Grade Type Integrity 1
          code: GTINT1
          sequence: 10
      - step: Setup - create school (s1)
        action: create
        model: school
        save_as: school
        values:
          name: School Integrity 1
          code: SCHINT1
          grade_type_id: "REC: grade_type.id"
      - step: Setup - create the other school (s1)
        action: create
        model: school
        save_as: other_school
        values:
          name: Other School Integrity 1
          code: SCHINT21
          grade_type_id: "REC: grade_type.id"
      - step: Setup - create grade (s1)
        action: create
        model: school_grade
        save_as: grade
        values:
          name: Grade Integrity 1
          code: GINT1
          sequence: 10
          type_id: "REC: grade_type.id"
      - step: Setup - create the grade of the other school (s1)
        action: create
        model: school_grade
        save_as: other_school_grade
        values:
          name: Grade Other School Integrity 1
          code: GINT21
          sequence: 20
          type_id: "REC: grade_type.id"
      - step: Setup - create the uncapped grade class (s1)
        action: create
        model: school_grade_class
        save_as: grade_class
        values:
          name: Class Integrity 1
          code: CLINT1
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
      - step: Setup - create the grade class of the other school (s1)
        action: create
        model: school_grade_class
        save_as: other_grade_class
        values:
          name: Class Other School Integrity 1
          code: CLINT21
          school_id: "REC: other_school.id"
          grade_id: "REC: other_school_grade.id"
      - step: Setup - create academic year (s1)
        action: create
        model: school_academic_year
        save_as: year
        values:
          name: Year Integrity 1
          code: AYINT1
          date_start: "2024-07-01"
          date_end: "2025-06-30"
      - step: Setup - create the other academic year (s1)
        action: create
        model: school_academic_year
        save_as: other_year
        values:
          name: Other Year Integrity 1
          code: AYINT21
          date_start: "2025-07-01"
          date_end: "2026-06-30"
      - step: Setup - create the term open for enrollment (s1)
        action: create
        model: school_academic_term
        save_as: term
        values:
          name: Term Integrity 1
          code: TMINT1
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "REC: year.id"
          enrollment_state: open
      - step: Setup - create the term closed for enrollment (s1)
        action: create
        model: school_academic_term
        save_as: closed_term
        values:
          name: Closed Term Integrity 1
          code: TMINTCL1
          date_start: "2025-01-01"
          date_end: "2025-06-30"
          year_id: "REC: year.id"
          enrollment_state: close
      - step: Setup - create the contact of the first student (s1)
        action: create
        model: res.partner
        save_as: contact
        values:
          name: Contact Integrity 1
      - step: Setup - create the first student (s1)
        action: create
        model: school_student
        save_as: student
        values:
          name: Student Integrity 1
          code: STUINT1
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"
      - step: Setup - create the contact of the second student (s1)
        action: create
        model: res.partner
        save_as: other_contact
        values:
          name: Other Contact Integrity 1
      - step: Setup - create the second student (s1)
        action: create
        model: school_student
        save_as: other_student
        values:
          name: Other Student Integrity 1
          code: STUINT21
          contact_id: "REC: other_contact.id"
          school_id: "REC: school.id"
      - step: Setup - create the grade class capped at one seat (s1)
        action: create
        model: school_grade_class
        save_as: capped_grade_class
        values:
          name: Class Capacity Integrity 1
          code: CLCAP1
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          capacity: 1
      - step: Create the consistent enrollment
        action: create
        model: school_enrollment
        save_as: enrollment
        values:
          date: "2024-07-01"
          academic_year_id: "REC: year.id"
          academic_term_id: "REC: term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"
      - step: Open the enrollment
        action: write
        target: enrollment
        values:
          state: open
      - step: Assert the enrollment is open
        action: assert
        target: enrollment
        asserts:
          state:
            type: value
            expected: open
