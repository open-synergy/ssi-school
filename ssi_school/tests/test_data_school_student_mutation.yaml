      - step: "Invalidate cache before approving reverse mutation"
        action: "call"
        target: "mutation_reverse"
        method: "invalidate_cache"

      - step: "Approve reverse mutation"
        action: "call"
        target: "mutation_reverse"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert enrollment moved back to class A"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["id", "=", "EVAL: registry['enrollment'].id"]
          - ["grade_class_id", "=", "EVAL: registry['grade_class_a'].id"]
        save_as: "check_moved_back"
        expect_count: 1
