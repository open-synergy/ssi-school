options:
  auto_refresh: true
scenarios:
  - name: "Create Payment Template"
    steps:
      - step: "Setup - get customer invoice journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable PTPCI01"
          code: "PTPCI01"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type PTPCI01"
          code: "PTPCI01"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type PMT Create"
          code: "GTPMTCR"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School PMT Create"
          code: "SCHPMTCR"
          grade_type_id: "EVAL: registry['grade_type'].id"
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade PMT Create"
          code: "GPMTCR"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"
      - step: "Create payment template"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "template"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          name: "New Payment Template"
          code: "PMT002"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
      - step: "Assert created"
        action: "assert"
        target: "template"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "New Payment Template"
          school_id:
            type: "value"
            operator: "is_truthy"
          grade_id:
            type: "value"
            operator: "is_truthy"

  - name: "Create Payment Template Without School And Grade"
    steps:
      - step: "Setup - get customer invoice journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
