options:
  auto_refresh: true
scenarios:
  - name: "Onchange Final Account From Product Usage"
    steps:
      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account"
        values:
          name: "School Fee Final Income RRA"
          code: "RRA4200"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create final usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "final_usage"
        values:
          name: "Final Revenue RRA"
          code: "FINALRRA"
          account_id: "REC: final_account.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee RRA"
          type: "service"
          list_price: 1000000.0

      - step:
          "Selecting Final Usage fills Final Account from the product's usage account"
        action: form
        model: "school_enrollment_payment_term_detail"
        save: false
        values:
          product_id: "REC: product"
          final_usage_id: "REC: final_usage"
        asserts:
          final_account_id.id:
            type: "value"
            expected: "REC: final_account.id"

      - step: "Without Final Usage selected, Final Account stays empty"
        action: form
        model: "school_enrollment_payment_term_detail"
        save: false
        values:
          product_id: "REC: product"
        asserts:
          final_account_id:
            type: "value"
            operator: "is_falsy"

  - name: "Compute Payment Copies Final Usage And Account From Template"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type"

      - step: "Setup - create deferred income account"
        action: "create"
        model: "account.account"
        save_as: "deferred_account"
        values:
          name: "School Fee Deferred Income RRB"
          code: "RRB4100"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account"
        values:
          name: "School Fee Final Income RRB"
          code: "RRB4200"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "School Receivable RRB"
          code: "RRB1100"
          user_type_id: "REC: receivable_type.id"
          reconcile: true

      - step: "Setup - create final usage type"
        action: "create"
        model: "product.usage_type"
        save_as: "final_usage"
        values:
          name: "Final Revenue RRB"
          code: "FINALRRB"
          account_id: "REC: final_account.id"

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type RRB"
          code: "CITRRB"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee RRB"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type RRB"
          code: "GTRRB"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 RRB"
          code: "AYRRB"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester RRB"
          code: "SMRRB"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School RRB"
          code: "SCHRRB"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade RRB"
          code: "GRRB"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class RRB"
          code: "CLRRB"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact RRB"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student RRB"
          code: "STURRB"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Setup - create payment template with a Final Usage/Account detail"
        action: "create"
        model: "school_enrollment_payment_template"
        save_as: "payment_template"
        values:
          name: "Payment Template RRB"
          code: "PMTRRB"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          academic_term_id: "REC: academic_term.id"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          customer_invoice_type_id: "REC: ci_type.id"
          revenue_recognition: true
          recognition_journal_id: "REC: journal.id"
          term_ids:
            - name: "Term 1 RRB"
              sequence: 10
              detail_ids:
                - product_id: "REC: product.id"
                  name: "Fee RRB"
                  account_id: "REC: deferred_account.id"
                  final_usage_id: "REC: final_usage.id"
                  final_account_id: "REC: final_account.id"
                  uom_quantity: 1.0
                  uom_id: "REF: uom.product_uom_unit"
                  price_unit: 1000000.0

      - step: "Create enrollment from the template"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"
          payment_template_id: "REC: payment_template.id"
          receivable_journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          customer_invoice_type_id: "REC: ci_type.id"
          revenue_recognition: true
          recognition_journal_id: "REC: journal.id"

      - step: "Compute payment from the template"
        action: "call"
        target: "enrollment"
        method: "action_compute_payment"
        as_user: "base.user_admin"

      - step: "Get the generated detail"
        action: "search"
        model: "school_enrollment_payment_term_detail"
        domain: [["term_id.enrollment_id", "=", "REC: enrollment.id"]]
        save_as: "detail"
        expect_count: 1

      - step: "Assert the detail copied Final Usage and Final Account from the template"
        action: "assert"
        target: "detail"
        asserts:
          final_usage_id.id:
            type: "value"
            expected: "REC: final_usage.id"
          final_account_id.id:
            type: "value"
            expected: "REC: final_account.id"

  - name: "Revenue Recognition Skips Uninvoiced And Final-Account-Less Details"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type"

      - step: "Setup - create deferred income account"
        action: "create"
        model: "account.account"
        save_as: "deferred_account"
        values:
          name: "School Fee Deferred Income RRC"
          code: "RRC4100"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create final income account"
        action: "create"
        model: "account.account"
        save_as: "final_account"
        values:
          name: "School Fee Final Income RRC"
          code: "RRC4200"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "School Receivable RRC"
          code: "RRC1100"
          user_type_id: "REC: receivable_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type RRC"
          code: "CITRRC"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee RRC"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type RRC"
          code: "GTRRC"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 RRC"
          code: "AYRRC"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester RRC"
          code: "SMRRC"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School RRC"
          code: "SCHRRC"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade RRC"
          code: "GRRC"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class RRC"
          code: "CLRRC"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact RRC"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student RRC"
          code: "STURRC"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Create enrollment with Revenue Recognition enabled"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          customer_invoice_type_id: "REC: ci_type.id"
          revenue_recognition: true
          recognition_journal_id: "REC: journal.id"

      - step: "Create term 1 (will be invoiced)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_1"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term 1 RRC"
          sequence: 10
          date_invoice: "2024-07-05"
          date_due: "2024-07-20"

      - step: "Create term 1 detail with a Final Account"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_1a"
        values:
          term_id: "REC: term_1.id"
          product_id: "REC: product.id"
          name: "Registration Fee RRC"
          account_id: "REC: deferred_account.id"
          final_account_id: "REC: final_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Create term 1 second detail WITHOUT a Final Account -- e.g. a deposit"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_1b"
        values:
          term_id: "REC: term_1.id"
          product_id: "REC: product.id"
          name: "Deposit RRC"
          account_id: "REC: deferred_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 200000.0

      - step: "Create term 2 (will be invoiced)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_2"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term 2 RRC"
          sequence: 20
          date_invoice: "2024-08-05"
          date_due: "2024-08-20"

      - step: "Create term 2 detail with a Final Account"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_2a"
        values:
          term_id: "REC: term_2.id"
          product_id: "REC: product.id"
          name: "Monthly Tuition RRC"
          account_id: "REC: deferred_account.id"
          final_account_id: "REC: final_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 500000.0

      - step: "Create term 3 (left uninvoiced)"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term_3"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term 3 RRC"
          sequence: 30
          date_invoice: "2024-09-05"
          date_due: "2024-09-20"

      - step: "Create term 3 detail with a Final Account"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        save_as: "detail_3a"
        values:
          term_id: "REC: term_3.id"
          product_id: "REC: product.id"
          name: "Later Tuition RRC"
          account_id: "REC: deferred_account.id"
          final_account_id: "REC: final_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 700000.0

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert enrollment is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invoice term 1"
        action: "call"
        target: "term_1"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get term 1's generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_1.customer_invoice_id.id"]]
        save_as: "term_1_invoice"
        expect_count: 1

      - step: "Confirm term 1 invoice"
        action: "call"
        target: "term_1_invoice"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert term 1 invoice is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "term_1_invoice"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open term 1 invoice"
        action: "call"
        target: "term_1_invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Invoice term 2"
        action: "call"
        target: "term_2"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get term 2's generated invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_2.customer_invoice_id.id"]]
        save_as: "term_2_invoice"
        expect_count: 1

      - step: "Confirm term 2 invoice"
        action: "call"
        target: "term_2_invoice"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert term 2 invoice is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "term_2_invoice"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Open term 2 invoice"
        action: "call"
        target: "term_2_invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Finish the enrollment"
        action: "call"
        target: "enrollment"
        method: "action_done"
        as_user: "base.user_admin"

      - step: "Assert one Revenue Recognition move was posted"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "done"
          recognition_move_id:
            type: "value"
            operator: "is_truthy"
          recognition_move_id.state:
            type: "value"
            expected: "posted"
          recognition_move_id.journal_id.id:
            type: "value"
            expected: "REC: journal.id"

      - step:
          "Assert exactly the two invoiced, Final-Account-bearing details were
          recognized"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["enrollment_id", "=", "REC: enrollment.id"]]
        save_as: "recognition_lines"
        expect_count: 2

      - step: "Assert the term 1 recognition line accounts and amount"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["payment_term_detail_id", "=", "REC: detail_1a.id"]]
        save_as: "line_1a"
        expect_count: 1

      - step: "Assert line 1a accounts and amount"
        action: "assert"
        target: "line_1a"
        asserts:
          debit_account_id.id:
            type: "value"
            expected: "REC: deferred_account.id"
          credit_account_id.id:
            type: "value"
            expected: "REC: final_account.id"
          amount:
            type: "value"
            expected: 1000000.0

      - step: "Assert term 3 (uninvoiced) produced no recognition line"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["payment_term_detail_id", "=", "REC: detail_3a.id"]]
        save_as: "line_3a"
        expect_count: 0

      - step:
          "Assert the deposit detail (no Final Account) produced no recognition line"
        action: "search"
        model: "school_enrollment_revenue_recognition_line"
        domain: [["payment_term_detail_id", "=", "REC: detail_1b.id"]]
        save_as: "line_1b"
        expect_count: 0

