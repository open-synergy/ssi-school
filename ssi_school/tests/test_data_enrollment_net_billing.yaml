        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "S4: create the credit as a plain journal entry"
        action: "create"
        model: "account.move"
        save_as: "credit_move"
        values:
          journal_id: "REC: bank_journal.id"
          date: 2026-08-28
          ref: "NBB4 credit"
          line_ids:
            - - 0
              - 0
              - name: "NBB4 credit - Liquidity"
                account_id: "REC: liq_account.id"
                partner_id: "EVAL: registry['invoice'].partner_id.id"
                debit: 400000.0
                credit: 0.0
            - - 0
              - 0
              - name: "NBB4 credit - Receivable"
                account_id: "REC: ci_account.id"
                partner_id: "EVAL: registry['invoice'].partner_id.id"
                debit: 0.0
                credit: 400000.0

      - step: "S4: post the credit"
        action: "call"
        target: "credit_move"
        method: "action_post"
        asserts:
          state:
            type: "value"
            expected: "posted"

      - step: "S4: find the credit's receivable journal item"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: credit_move.id"],
            ["account_id", "=", "REC: ci_account.id"],
          ]
        save_as: "credit_line"
        expect_count: 1

      - step: "S4: find both receivable journal items"
        action: "search"
        model: "account.move.line"
        domain:
          [
            [
              "id",
              "in",
              ["REC: credit_line.id", "REC: invoice.receivable_move_line_id.id"],
            ],
          ]
        save_as: "reconcile_lines"
        expect_count: 2

      - step: "S4: reconcile the credit against the invoice"
        action: "call"
        target: "reconcile_lines"
        method: "reconcile"

      - step:
          "Force the enrollment into cancel (action_cancel itself refuses while a term
          is invoiced; this direct write isolates the compute-only guarantee)"
        action: "write"
        target: "enrollment"
        values:
          state: "cancel"

      - step: "Assert the term follows the enrollment to cancelled"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "cancelled"

      - step: "Assert the billing breakdown"
