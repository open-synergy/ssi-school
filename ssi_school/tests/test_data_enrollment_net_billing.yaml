options:
  auto_refresh: true
scenarios:
  - name: "Partial bank payment is a payment and keeps the identities"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "rec_type"

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "rev_type"

      - step: "Setup - get liquidity account type"
        action: "ref"
        xml_id: "account.data_account_type_liquidity"
        save_as: "liq_type"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "NBB Receivable 1"
          code: "NBBR1"
          user_type_id: "REC: rec_type.id"
          reconcile: true

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "NBB Income 1"
          code: "NBBI1"
          user_type_id: "REC: rev_type.id"

      - step: "Setup - create liquidity account"
        action: "create"
        model: "account.account"
        save_as: "liq_account"
        values:
          name: "NBB Liquidity 1"
          code: "NBBL1"
          user_type_id: "REC: liq_type.id"

      - step: "Setup - create bank journal"
        action: "create"
        model: "account.journal"
        save_as: "bank_journal"
        values:
          name: "NBB Bank 1"
          code: "NBBB1"
          type: "bank"
          default_account_id: "REC: liq_account.id"

      - step: "Setup - create general journal"
        action: "create"
        model: "account.journal"
        save_as: "general_journal"
        values:
          name: "NBB General 1"
          code: "NBBG1"
          type: "general"

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "NBB Invoice Type 1"
          code: "NBB1"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type NBB1"
          code: "GTNBB1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 NBB1"
          code: "AYNBB1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester NBB1"
          code: "SMNBB1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School NBB1"
          code: "SCHNBB1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade NBB1"
          code: "GNBB1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Class NBB1"
          code: "CLANBB1"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact NBB1"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student NBB1"
          code: "STUNBB1"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Create enrollment"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          receivable_journal_id: "REC: ci_journal.id"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Fee NBB1"
          type: "service"
          list_price: 1000000.0

      - step: "Create payment term"
        action: "create"
        model: "school_enrollment_payment_term"
        save_as: "term"
        values:
          enrollment_id: "REC: enrollment.id"
          name: "Term 1 NBB1"
          sequence: 10

      - step: "Create detail on the term"
        action: "create"
        model: "school_enrollment_payment_term_detail"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee NBB1"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert enrollment is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create customer invoice from the term"
        action: "call"
        target: "term"
        method: "action_create_invoice"
        as_user: "base.user_admin"

      - step: "Get the generated customer invoice"
        action: "search"
        model: "customer_invoice"
        domain: [["customer_document_number", "=", "REC: enrollment.name"]]
        save_as: "invoice"
        expect_count: 1

      - step: "Confirm the customer invoice"
        action: "call"
        target: "invoice"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the customer invoice"
        action: "call"
        target: "invoice"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "S1: create the credit as a plain journal entry"
        action: "create"
        model: "account.move"
        save_as: "credit_move"
        values:
          journal_id: "REC: bank_journal.id"
          date: 2026-08-28
          ref: "NBB1 credit"
          line_ids:
            - - 0
              - 0
              - name: "NBB1 credit - Liquidity"
                account_id: "REC: liq_account.id"
                partner_id: "EVAL: registry['invoice'].partner_id.id"
                debit: 400000.0
                credit: 0.0
            - - 0
              - 0
              - name: "NBB1 credit - Receivable"
                account_id: "REC: ci_account.id"
                partner_id: "EVAL: registry['invoice'].partner_id.id"
                debit: 0.0
                credit: 400000.0

      - step: "S1: post the credit"
        action: "call"
        target: "credit_move"
        method: "action_post"
        asserts:
          state:
            type: "value"
            expected: "posted"

      - step: "S1: find the credit's receivable journal item"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: credit_move.id"],
            ["account_id", "=", "REC: ci_account.id"],
          ]
        save_as: "credit_line"
        expect_count: 1

      - step: "S1: find both receivable journal items"
        action: "search"
        model: "account.move.line"
        domain:
          [
            [
              "id",
              "in",
              ["REC: credit_line.id", "REC: invoice.receivable_move_line_id.id"],
            ],
          ]
        save_as: "reconcile_lines"
        expect_count: 2

      - step: "S1: reconcile the credit against the invoice"
        action: "call"
        target: "reconcile_lines"
        method: "reconcile"

      - step: "Assert the billing breakdown"
        action: "assert"
        target: "enrollment"
        asserts:
          amount_total:
            type: "value"
            expected: 1000000.0
          amount_deduction:
            type: "value"
            expected: 0.0
          amount_net:
            type: "value"
            expected: 1000000.0
          amount_deducted:
            type: "value"
            expected: 0.0
          amount_deduction_pending:
            type: "value"
            expected: 0.0
          amount_paid:
            type: "value"
            expected: 400000.0
          amount_payment:
            type: "value"
            expected: 400000.0
          amount_other_credit:
            type: "value"
            expected: 0.0
          amount_residual:
            type: "value"
            expected: 600000.0
          amount_outstanding:
            type: "value"
            expected: 600000.0

