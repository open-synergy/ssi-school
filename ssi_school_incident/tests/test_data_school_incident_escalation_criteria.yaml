scenarios:
  - name: "Create Incident Escalation Criteria - Level 2"
    steps:
      - step: "Create escalation criteria targeting level 2"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "Repeated Incident within 30 Days"
          code: "ESC-REPEAT-30D"
          sequence: 10
          target_level: "level_2"
          verification_method: >-
            Check the Master Log for another case with the same student within the last
            30 days.
      - step: "Assert created successfully"
        action: "assert"
        target: "criteria"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Repeated Incident within 30 Days"
          target_level:
            type: "value"
            expected: "level_2"

  - name: "Create Incident Escalation Criteria - Level 3"
    steps:
      - step: "Create escalation criteria targeting level 3"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "Physical Harm Involved"
          code: "ESC-PHYSICAL"
          sequence: 20
          target_level: "level_3"
          verification_method: >-
            Confirm with the reporting teacher whether physical harm to any party
            occurred.
      - step: "Assert target level"
        action: "assert"
        target: "criteria"
        asserts:
          target_level:
            type: "value"
            expected: "level_3"

  - name: "Edit Incident Escalation Criteria Name"
    steps:
      - step: "Create escalation criteria"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "Media Attention Risk"
          code: "ESC-MEDIA"
          sequence: 30
          target_level: "level_3"
      - step: "Write new name"
        action: "write"
        target: "criteria"
        values:
          name: "Public/Media Attention Risk"
      - step: "Assert name updated"
        action: "assert"
        target: "criteria"
        asserts:
          name:
            type: "value"
            expected: "Public/Media Attention Risk"

  - name: "Edit Incident Escalation Criteria Sequence"
    steps:
      - step: "Create escalation criteria"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "Parent Formal Complaint Letter"
          code: "ESC-LETTER"
          sequence: 40
          target_level: "level_2"
      - step: "Write new sequence"
        action: "write"
        target: "criteria"
        values:
          sequence: 99
      - step: "Assert sequence updated"
        action: "assert"
        target: "criteria"
        asserts:
          sequence:
            type: "value"
            expected: 99

  - name: "Delete Incident Escalation Criteria"
    steps:
      - step: "Create escalation criteria"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "To Be Deleted"
          code: "ESC-DEL"
          sequence: 50
      - step: "Delete escalation criteria"
        action: "call"
        target: "criteria"
        method: "unlink"
      - step: "Search expects zero results"
        action: "search"
        model: "school_incident_escalation_criteria"
        domain: [["code", "=", "ESC-DEL"]]
        save_as: "result"
        expect_count: 0
