options:
  auto_refresh: true

scenarios:
  - name: "Weekly Review Full Workflow Create Confirm Done"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Weekly Review Workflow Test"
          code: "GTWRWF"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Weekly Review Workflow Test"
          code: "SCHWRWF"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Create weekly review"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review"
        values:
          school_id: "EVAL: registry['school'].id"
          date_start: 2026-06-22
          date_end: 2026-06-26

      - step: "Assert review created in draft"
        action: "assert"
        target: "review"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          count_total:
            type: "value"
            expected: 0
          count_overdue:
            type: "value"
            expected: 0
          count_unresolved_over_7d:
            type: "value"
            expected: 0
          count_escalated:
            type: "value"
            expected: 0

      - step: "Confirm review"
        action: "call"
        target: "review"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve review"
        action: "call"
        target: "review"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"
          name:
            type: "value"
            operator: "contains"
            expected: "WR"

  - name: "Cancel Weekly Review From Draft"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Weekly Review Cancel Test"
          code: "GTWRCX"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Weekly Review Cancel Test"
          code: "SCHWRCX"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Create weekly review"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review"
        values:
          school_id: "EVAL: registry['school'].id"
          date_start: 2026-06-22
          date_end: 2026-06-26

      - step: "Cancel review"
        action: "call"
        target: "review"
        method: "action_cancel"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart review"
        action: "call"
        target: "review"
        method: "action_restart"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "draft"

  # NOTE: the three scenarios below share one database transaction (all
  # scenarios in a file do). "Collect Incidents Without School" collects
  # every incident in its date range regardless of School, so it must stay
  # the FIRST scenario that creates a school_incident in this file. The two
  # scenarios after it are scoped by School and are therefore immune to it.
  - name: "Collect Incidents Without School Includes All Schools"
    steps:
      - step: "Setup - create grade type for the first school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_1"
        values:
          name: "Grade Type for Weekly Review All Schools 1"
          code: "GTWRAS1"
          sequence: 10

      - step: "Setup - create the first school"
        action: "create"
        model: "school"
        save_as: "school_1"
        values:
          name: "School for Weekly Review All Schools 1"
          code: "SCHWRAS1"
          grade_type_id: "REC: grade_type_1.id"

      - step: "Setup - create the first student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Weekly Review All Schools Student Contact 1"

      - step: "Setup - create the first student"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student for Weekly Review All Schools 1"
          code: "STUWRAS1"
          contact_id: "REC: contact_1.id"
          school_id: "REC: school_1.id"

      - step: "Setup - create grade type for the second school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_2"
        values:
          name: "Grade Type for Weekly Review All Schools 2"
          code: "GTWRAS2"
          sequence: 10

      - step: "Setup - create the second school"
        action: "create"
        model: "school"
        save_as: "school_2"
        values:
          name: "School for Weekly Review All Schools 2"
          code: "SCHWRAS2"
          grade_type_id: "REC: grade_type_2.id"

      - step: "Setup - create the second student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Weekly Review All Schools Student Contact 2"

      - step: "Setup - create the second student"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student for Weekly Review All Schools 2"
          code: "STUWRAS2"
          contact_id: "REC: contact_2.id"
          school_id: "REC: school_2.id"

      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Incident Type Weekly Review All Schools"
          code: "INCTYPE-WR-AS"

      - step: "Create an in-range incident in the first school"
        action: "create"
        model: "school_incident"
        save_as: "incident_school_1"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=5)).date()"
          student_id: "REC: student_1.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - in range, first school."
          resolution_status: "in_progress"

      - step: "Create an in-range incident in the second school"
        action: "create"
        model: "school_incident"
        save_as: "incident_school_2"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=3)).date()"
          student_id: "REC: student_2.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - in range, second school."
          resolution_status: "in_progress"

      - step: "Create an out-of-range incident in the first school"
        action: "create"
        model: "school_incident"
        save_as: "incident_out_of_range"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=60)).date()"
          student_id: "REC: student_1.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - out of range."
          resolution_status: "in_progress"

      - step: "Create a weekly review without a school"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review"
        values:
          date_start: "EVAL: (datetime.now() - timedelta(days=15)).date()"
          date_end: "EVAL: datetime.now().date()"

      - step: "Collect the incidents"
        action: "call"
        target: "review"
        method: "action_collect_incidents"

      - step: "Assert both schools are collected and the out-of-range one is not"
        action: "assert"
        target: "review"
        asserts:
          incident_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: incident_school_1"
              - "REC: incident_school_2"
          count_total:
            type: "value"
            expected: 2

  - name: "Collect Incidents Filters By School And Date Range"
    steps:
      - step: "Setup - create grade type for the reviewed school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_1"
        values:
          name: "Grade Type for Weekly Review Scoping 1"
          code: "GTWRSC1"
          sequence: 10

      - step: "Setup - create the reviewed school"
        action: "create"
        model: "school"
        save_as: "school_1"
        values:
          name: "School for Weekly Review Scoping 1"
          code: "SCHWRSC1"
          grade_type_id: "REC: grade_type_1.id"

      - step: "Setup - create the reviewed student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_1"
        values:
          name: "Weekly Review Scoping Student Contact 1"

      - step: "Setup - create the reviewed student"
        action: "create"
        model: "school_student"
        save_as: "student_1"
        values:
          name: "Student for Weekly Review Scoping 1"
          code: "STUWRSC1"
          contact_id: "REC: contact_1.id"
          school_id: "REC: school_1.id"

      - step: "Setup - create grade type for the other school"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type_2"
        values:
          name: "Grade Type for Weekly Review Scoping 2"
          code: "GTWRSC2"
          sequence: 10

      - step: "Setup - create the other school"
        action: "create"
        model: "school"
        save_as: "school_2"
        values:
          name: "School for Weekly Review Scoping 2"
          code: "SCHWRSC2"
          grade_type_id: "REC: grade_type_2.id"

      - step: "Setup - create the other student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_2"
        values:
          name: "Weekly Review Scoping Student Contact 2"

      - step: "Setup - create the other student"
        action: "create"
        model: "school_student"
        save_as: "student_2"
        values:
          name: "Student for Weekly Review Scoping 2"
          code: "STUWRSC2"
          contact_id: "REC: contact_2.id"
          school_id: "REC: school_2.id"

      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Incident Type Weekly Review Scoping"
          code: "INCTYPE-WR-SC"

      - step: "Create an in-range incident in the reviewed school"
        action: "create"
        model: "school_incident"
        save_as: "in_range_same_school"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=5)).date()"
          student_id: "REC: student_1.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - in range, reviewed school."
          resolution_status: "in_progress"

      - step: "Create an out-of-range incident in the reviewed school"
        action: "create"
        model: "school_incident"
        save_as: "out_of_range_same_school"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=60)).date()"
          student_id: "REC: student_1.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - out of range, reviewed school."
          resolution_status: "in_progress"

      - step: "Create an in-range incident in the other school"
        action: "create"
        model: "school_incident"
        save_as: "in_range_other_school"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=3)).date()"
          student_id: "REC: student_2.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - in range, other school."
          resolution_status: "in_progress"

      - step: "Create a weekly review scoped to the reviewed school"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review"
        values:
          school_id: "REC: school_1.id"
          date_start: "EVAL: (datetime.now() - timedelta(days=15)).date()"
          date_end: "EVAL: datetime.now().date()"

      - step: "Collect the incidents"
        action: "call"
        target: "review"
        method: "action_collect_incidents"

      - step: "Assert only the in-range incident of the reviewed school is collected"
        action: "assert"
        target: "review"
        asserts:
          incident_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: in_range_same_school"
          count_total:
            type: "value"
            expected: 1

  - name: "Counters For Overdue Escalated And Unresolved Over Seven Days"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Weekly Review Counters Test"
          code: "GTWRCNT"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Weekly Review Counters Test"
          code: "SCHWRCNT"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Weekly Review Counters Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Weekly Review Counters"
          code: "STUWRCNT"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Incident Type Weekly Review Counters"
          code: "INCTYPE-WR-CNT"

      # Overdue and still unresolved beyond 7 days: no first contact, no
      # resolution recorded, and an incident date far enough in the past
      # that both the First Contact and Resolution SLA of tier 1 have long
      # since passed.
      - step: "Create an unresolved, overdue incident"
        action: "create"
        model: "school_incident"
        save_as: "not_resolved_overdue"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=10)).date()"
          student_id: "REC: student.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - unresolved and overdue."
          resolution_status: "not_resolved"

      # Escalated and overdue (the tier 3 resolution SLA is 168h/7 days, and
      # 10 days ago is already past that), but it must NOT be counted as
      # "unresolved over 7 days" because it is already escalated.
      - step: "Create an escalated, overdue incident"
        action: "create"
        model: "school_incident"
        save_as: "escalated_overdue"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=10)).date()"
          student_id: "REC: student.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "3"
          description: "Weekly Review test case - escalated and overdue."
          resolution_status: "escalated"

      # Resolved well within SLA: first contact on the incident day, resolved
      # the day after, so it counts neither as overdue nor as unresolved.
      - step: "Create an incident resolved within its SLA"
        action: "create"
        model: "school_incident"
        save_as: "resolved_on_time"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=10)).date()"
          date_first_contact: "EVAL: datetime.now() - timedelta(days=10)"
          date_resolved: "EVAL: (datetime.now() - timedelta(days=9)).date()"
          student_id: "REC: student.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - resolved on time."
          resolution_status: "resolved_satisfied"

      # Entirely outside the review's date range, so it can never be
      # collected and can never pollute any of the counters.
      - step: "Create an out-of-range unresolved incident"
        action: "create"
        model: "school_incident"
        save_as: "out_of_range"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=60)).date()"
          student_id: "REC: student.id"
          incident_type_id: "REC: incident_type.id"
          handling_level: "1"
          description: "Weekly Review test case - out of range."
          resolution_status: "not_resolved"

      - step: "Create a weekly review scoped to that school"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review"
        values:
          school_id: "REC: school.id"
          date_start: "EVAL: (datetime.now() - timedelta(days=15)).date()"
          date_end: "EVAL: datetime.now().date()"

      - step: "Collect the incidents"
        action: "call"
        target: "review"
        method: "action_collect_incidents"

      - step: "Assert the three in-range incidents were collected"
        action: "assert"
        target: "review"
        asserts:
          incident_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: not_resolved_overdue"
              - "REC: escalated_overdue"
              - "REC: resolved_on_time"
          count_total:
            type: "value"
            expected: 3

      - step: "Assert the overdue, escalated and unresolved counters"
        action: "assert"
        target: "review"
        asserts:
          count_overdue:
            type: "value"
            expected: 2
          count_escalated:
            type: "value"
            expected: 1
          count_unresolved_over_7d:
            type: "value"
            expected: 1

  - name: "Weekly Review Own Workflow Group Is Enforced"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Weekly Review Group Test"
          code: "GTWRGRP"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Weekly Review Group Test"
          code: "SCHWRGRP"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create a user in school_incident_weekly_review_user_group"
        action: "create"
        model: "res.users"
        save_as: "review_user"
        values:
          name: "Weekly Review User Group Member"
          login: "weekly_review_user_336@example.com"
          groups_id:
            [
              [
                6,
                0,
                [
                  "REF: base.group_user",
                  "REF: ssi_school_incident.school_incident_weekly_review_user_group",
                ],
              ],
            ]

      - step: "Setup - create a user in none of the review groups"
        action: "create"
        model: "res.users"
        save_as: "review_outsider"
        values:
          name: "Weekly Review Outsider"
          login: "weekly_review_outsider_336@example.com"
          groups_id: [[6, 0, ["REF: base.group_user"]]]

      - step: "school_incident_weekly_review_user_group member can create"
        action: "create"
        model: "school_incident_weekly_review"
        save_as: "review_group_test"
        as_user: "review_user"
        values:
          school_id: "REC: school.id"
          date_start: 2026-07-06
          date_end: 2026-07-10
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "school_incident_weekly_review_user_group member can confirm"
        action: "call"
        target: "review_group_test"
        method: "action_confirm"
        as_user: "review_user"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Outsider (no review group) cannot write the review"
        action: "write"
        target: "review_group_test"
        as_user: "review_outsider"
        values:
          note: "Should not be allowed"
        expect_error:
          type: "AccessError"
