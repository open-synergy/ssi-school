scenarios:
  - name: "Create Incident Type - Tier 1"
    steps:
      - step: "Create incident type with default handling level 1"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Bullying"
          code: "INCTYPE-BULLY"
          default_handling_level: "1"
      - step: "Assert created successfully"
        action: "assert"
        target: "incident_type"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Bullying"
          default_handling_level:
            type: "value"
            expected: "1"

  - name: "Create Incident Type - Health-Related with SLA"
    steps:
      - step: "Create health-related incident type with first contact SLA"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Injury"
          code: "INCTYPE-INJURY"
          is_health: true
          first_contact_sla_hour: 2.5
      - step: "Assert health flag and SLA hour"
        action: "assert"
        target: "incident_type"
        asserts:
          is_health:
            type: "value"
            expected: true
          first_contact_sla_hour:
            type: "value"
            expected: 2.5

  - name: "Edit Incident Type Name"
    steps:
      - step: "Create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Bad Language"
          code: "INCTYPE-LANG"
          default_handling_level: "1"
      - step: "Write new name"
        action: "write"
        target: "incident_type"
        values:
          name: "Inappropriate Language"
      - step: "Assert name updated"
        action: "assert"
        target: "incident_type"
        asserts:
          name:
            type: "value"
            expected: "Inappropriate Language"

  - name: "Edit Incident Type Default Handling Level"
    steps:
      - step: "Create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Vandalism"
          code: "INCTYPE-VANDAL"
          default_handling_level: "1"
      - step: "Write new default handling level"
        action: "write"
        target: "incident_type"
        values:
          default_handling_level: "2"
      - step: "Assert default handling level updated"
        action: "assert"
        target: "incident_type"
        asserts:
          default_handling_level:
            type: "value"
            expected: "2"

  - name: "Delete Incident Type"
    steps:
      - step: "Create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "To Be Deleted"
          code: "INCTYPE-DEL"
      - step: "Delete incident type"
        action: "call"
        target: "incident_type"
        method: "unlink"
      - step: "Search expects zero results"
        action: "search"
        model: "school_incident_type"
        domain: [["code", "=", "INCTYPE-DEL"]]
        save_as: "result"
        expect_count: 0
