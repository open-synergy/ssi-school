      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Incident Creation"
          code: "STUALERTINC"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create academic alert with trigger_count = 5"
        action: "create"
        model: "school_academic_alert"
        save_as: "alert"
        values:
          date_alert: 2026-07-05
          student_id: "EVAL: registry['student'].id"
          subject_note: "Mathematics, Science, English"
          evaluation_context: "trigger_count = 5"

      - step: "Evaluate alert"
        action: "call"
        target: "alert"
        method: "action_evaluate"
        asserts:
          color:
            type: "value"
            expected: "red"

      - step: "Create incident from red alert"
        action: "call"
        target: "alert"
        method: "action_create_incident"
        as_user: "base.user_admin"
        asserts:
          incident_id:
            type: "value"
            operator: "is_truthy"

      - step: "Find the created incident"
        action: "search"
        model: "school_incident"
        domain: [["student_id", "=", "EVAL: registry['student'].id"]]
        save_as: "incident"
        expect_count: 1

      - step: "Assert incident uses the Academic incident type"
        action: "assert"
        target: "incident"
        asserts:
          incident_type_id:
            type: "m2o"
            expected_xml_id: "ssi_school_incident.school_incident_type_academic"
          handling_level:
            type: "value"
            expected: "2"
