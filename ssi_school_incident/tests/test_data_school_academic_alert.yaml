  - name: "Create Incident from Red Academic Alert"
    steps:
      - step: "Setup - create yellow level"
        action: "create"
        model: "school_academic_alert_level"
        save_as: "level_yellow"
        values:
          name: "Yellow Level Incident Scenario"
          code: "ALERT-YELLOW-S5"
          color: "yellow"
          sequence: 10
          python_code: "result = trigger_count >= 2"

      - step: "Setup - create orange level"
        action: "create"
