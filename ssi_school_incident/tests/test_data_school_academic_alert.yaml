options:
  auto_refresh: true

scenarios:
  - name: "Academic Alert Full Workflow Create Confirm Approve Done"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Academic Alert Workflow Test"
          code: "GTALERTWF"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Academic Alert Workflow Test"
          code: "SCHALERTWF"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Academic Alert Workflow Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Academic Alert Workflow"
          code: "STUALERTWF"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create academic alert"
        action: "create"
        model: "school_academic_alert"
        save_as: "alert"
        values:
          date_alert: 2026-07-01
          student_id: "EVAL: registry['student'].id"
          subject_note: "Mathematics, Science"

      - step: "Assert alert created in draft"
        action: "assert"
        target: "alert"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          alert_level_id:
            type: "value"
            operator: "is_falsy"

      - step: "Confirm alert"
        action: "call"
        target: "alert"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve alert"
        action: "call"
        target: "alert"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert document number generated"
        action: "assert"
        target: "alert"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "ALERT"

      - step: "Done alert"
        action: "call"
        target: "alert"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

  - name: "Evaluate Academic Alert Triggers Red Level"
    steps:
      - step: "Setup - create yellow level"
        action: "create"
        model: "school_academic_alert_level"
        save_as: "level_yellow"
        values:
          name: "Yellow Level Red Scenario"
          code: "ALERT-YELLOW-S2"
          color: "yellow"
          sequence: 10
          python_code: "result = trigger_count >= 2"

      - step: "Setup - create orange level"
        action: "create"
        model: "school_academic_alert_level"
        save_as: "level_orange"
        values:
          name: "Orange Level Red Scenario"
          code: "ALERT-ORANGE-S2"
          color: "orange"
          sequence: 20
          python_code: "result = trigger_count >= 3"

      - step: "Setup - create red level"
        action: "create"
        model: "school_academic_alert_level"
        save_as: "level_red"
        values:
          name: "Red Level Red Scenario"
          code: "ALERT-RED-S2"
          color: "red"
          sequence: 30
          python_code: "result = trigger_count >= 4"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Red Trigger Test"
          code: "GTALERTRED"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Red Trigger Test"
          code: "SCHALERTRED"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Red Trigger Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Red Trigger"
          code: "STUALERTRED"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create academic alert with trigger_count = 4"
        action: "create"
        model: "school_academic_alert"
        save_as: "alert"
        values:
          date_alert: 2026-07-02
          student_id: "EVAL: registry['student'].id"
          evaluation_context: "trigger_count = 4"

      - step: "Evaluate alert"
        action: "call"
        target: "alert"
        method: "action_evaluate"

      - step: "Assert red level triggered"
        action: "assert"
        target: "alert"
        asserts:
          color:
            type: "value"
            expected: "red"
          alert_level_id:
            type: "value"
            operator: "is_truthy"

