  - name: "Onchange Grade Class Derived From Student Active Enrollment"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Alert Onchange Grade Class Test"
          code: "GTALOCGC"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Alert Onchange Grade Class Test"
          code: "SCHALOCGC"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade for Alert Onchange Grade Class Test"
          code: "GALOCGC"
          sequence: 10
