scenarios:
  - name: "Parent Contact Log - First Contact Flag, Date Sync, Count, Cascade Delete"
    steps:
      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Parent Contact Log Case"
          code: "INCTYPE-PC-LOG"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Parent Contact Log Test"
          code: "GTPCLOG"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Parent Contact Log Test"
          code: "SCHPCLOG"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Parent Contact Log Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Parent Contact Log"
          code: "STUPCLOG"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create incident"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: 2026-07-01
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          description: "Case used to verify the parent contact log."

      - step: "Assert incident has no parent contacts yet"
        action: "assert"
        target: "incident"
        asserts:
          parent_contact_count:
            type: "value"
            expected: 0
          date_first_contact:
            type: "value"
            operator: "is_falsy"

      - step: "Create first (earlier) parent contact"
        action: "create"
        model: "school_incident_parent_contact"
        save_as: "contact_early"
        values:
          incident_id: "EVAL: registry['incident'].id"
          contact_datetime: 2026-07-01 08:00:00
          contact_method: "whatsapp"
          summary:
            "Empathy: acknowledged parent's concern. Facts: confirmed what happened.
            Solution: agreed on next step."

      - step: "Assert first contact is flagged as first contact"
        action: "assert"
        target: "contact_early"
        asserts:
          is_first_contact:
            type: "value"
            operator: "is_truthy"

      - step: "Assert incident date_first_contact synced to the first contact"
        action: "assert"
        target: "incident"
        asserts:
          date_first_contact:
            type: "value"
            expected: 2026-07-01 08:00:00
          parent_contact_count:
            type: "value"
            expected: 1

      - step: "Create second (later) parent contact"
        action: "create"
        model: "school_incident_parent_contact"
        save_as: "contact_late"
        values:
          incident_id: "EVAL: registry['incident'].id"
          contact_datetime: 2026-07-01 10:00:00
          contact_method: "phone"
          summary:
            "Empathy: thanked parent for their patience. Facts: shared the follow-up
            findings. Solution: confirmed the resolution."

      - step: "Assert second contact is not flagged as first contact"
        action: "assert"
        target: "contact_late"
        asserts:
          is_first_contact:
            type: "value"
            operator: "is_falsy"

      - step: "Assert first contact flag unchanged after adding a later contact"
        action: "assert"
        target: "contact_early"
        asserts:
          is_first_contact:
            type: "value"
            operator: "is_truthy"

      - step: "Assert incident has 2 parent contacts and date_first_contact unchanged"
        action: "assert"
        target: "incident"
        asserts:
          parent_contact_count:
            type: "value"
            expected: 2
          date_first_contact:
            type: "value"
            expected: 2026-07-01 08:00:00

      - step: "Create an even earlier parent contact"
        action: "create"
        model: "school_incident_parent_contact"
        save_as: "contact_earliest"
        values:
          incident_id: "EVAL: registry['incident'].id"
          contact_datetime: 2026-07-01 06:00:00
          contact_method: "face_to_face"
          summary:
            "Empathy: met the parent in person right away. Facts: explained the incident
            timeline. Solution: proposed an immediate action plan."

      - step: "Assert the new earliest contact is now flagged as first contact"
        action: "assert"
        target: "contact_earliest"
        asserts:
          is_first_contact:
            type: "value"
            operator: "is_truthy"

      - step: "Assert the previous first contact flag has flipped to false"
        action: "assert"
        target: "contact_early"
        asserts:
          is_first_contact:
            type: "value"
            operator: "is_falsy"

      - step: "Assert incident date_first_contact synced to the new earliest contact"
        action: "assert"
        target: "incident"
        asserts:
          date_first_contact:
            type: "value"
            expected: 2026-07-01 06:00:00
          parent_contact_count:
            type: "value"
            expected: 3

      - step: "Delete the incident (cascade delete test)"
        action: "call"
        target: "incident"
        method: "unlink"

      - step: "Assert parent contact log entries were cascade-deleted with the incident"
        action: "search"
        model: "school_incident_parent_contact"
        domain:
          - ["incident_id", "=", "EVAL: registry['incident'].id"]
        save_as: "contacts_after_delete"
        expect_count: 0
