  - name: "Compute First Contact Deadline From Incident Type SLA"
    steps:
      - step: "Setup - create incident type with first contact SLA"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "SLA Compute Case"
          code: "INCTYPE-SLA-COMPUTE"
          first_contact_sla_hour: 24.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for SLA Compute Test"
          code: "GTINCSLA"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for SLA Compute Test"
          code: "SCHINCSLA"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "SLA Compute Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for SLA Compute"
          code: "STUINCSLA"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create incident with handling level 1"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: 2026-07-01
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          handling_level: "1"
          description: "Case used to verify first contact deadline computation."

      - step: "Assert first contact deadline is incident date plus SLA hours"
        action: "assert"
        target: "incident"
        asserts:
          first_contact_deadline:
            type: "value"
            expected: 2026-07-02 00:00:00

  - name: "Overdue When First Contact Deadline Has Passed"
    steps:
      - step: "Setup - create incident type with first contact SLA"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "SLA Overdue Case"
          code: "INCTYPE-SLA-OVERDUE"
          first_contact_sla_hour: 24.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for SLA Overdue Test"
          code: "GTINCODUE"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for SLA Overdue Test"
          code: "SCHINCODUE"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "SLA Overdue Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for SLA Overdue"
          code: "STUINCODUE"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step:
          "Create incident with incident date 5 days in the past and no first contact"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: "EVAL: (datetime.now() - timedelta(days=5)).date()"
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          handling_level: "1"
          description: "Case used to verify overdue computation."

      - step: "Assert case is overdue"
        action: "assert"
        target: "incident"
        asserts:
          is_first_contact_overdue:
            type: "value"
            operator: "is_truthy"
          is_overdue:
            type: "value"
            operator: "is_truthy"

  - name: "Not First Contact Overdue Once First Contact Recorded"
    steps:
      - step: "Setup - create incident type with first contact SLA"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "SLA Contacted Case"
          code: "INCTYPE-SLA-CONTACTED"
          first_contact_sla_hour: 24.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for SLA Contacted Test"
          code: "GTINCCTD"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for SLA Contacted Test"
          code: "SCHINCCTD"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "SLA Contacted Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for SLA Contacted"
          code: "STUINCCTD"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create incident with first contact recorded right away"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: "EVAL: datetime.now().date()"
          date_first_contact: "EVAL: datetime.now()"
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          handling_level: "1"
          description:
            "Case used to verify first contact overdue is false once contacted."

      - step: "Assert case is not first contact overdue"
        action: "assert"
        target: "incident"
        asserts:
          is_first_contact_overdue:
            type: "value"
            operator: "is_falsy"

  - name: "Escalate Incident to Level 2 with Matching Criteria"
    steps:
      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Escalation Happy Path Case"
          code: "INCTYPE-ESC-HAPPY"
          default_handling_level: "1"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Escalation Happy Path"
          code: "GTINCESCH"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Escalation Happy Path"
          code: "SCHINCESCH"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Escalation Happy Path Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Escalation Happy Path"
          code: "STUINCESCH"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Setup - create matching escalation criteria (level 2)"
        action: "create"
        model: "school_incident_escalation_criteria"
        save_as: "criteria"
        values:
          name: "Repeated Incident within 30 Days (Happy Path)"
          code: "ESC-HAPPY-L2"
          sequence: 10
          target_level: "level_2"

      - step: "Create incident"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: 2026-07-04
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          handling_level: "1"
          description: "Case used to verify the guarded escalation happy path."

      - step: "Confirm incident"
        action: "call"
        target: "incident"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate incident cache before approve"
        action: "call"
        target: "incident"
        method: "invalidate_cache"

      - step: "Approve incident"
        action: "call"
        target: "incident"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert handling level is still tier 1 before escalation"
        action: "assert"
        target: "incident"
        asserts:
          handling_level:
            type: "value"
            expected: "1"

      - step: "Escalate incident to level 2 with a matching criterion"
        action: "call"
        target: "incident"
        method: "action_escalate"
        as_user: "base.user_admin"
        kwargs:
          target_level: "2"
          escalation_criteria_ids: "EVAL: registry['criteria']"
          escalation_reason:
            "Second incident with the same student within 30 days; escalating to
            Counselor/Vice Principal."
        asserts:
          handling_level:
            type: "value"
            expected: "2"
          resolution_status:
            type: "value"
            expected: "escalated"
          escalated_to_level:
            type: "value"
            expected: "2"
