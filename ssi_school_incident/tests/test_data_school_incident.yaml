options:
  auto_refresh: true

scenarios:
  - name: "Incident Full Workflow Create Confirm Approve Done"
    steps:
      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Bullying Case"
          code: "INCTYPE-WF-BULLY"
          default_handling_level: "1"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Incident Test"
          code: "GTINC"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Incident Test"
          code: "SCHINC"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Incident Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Incident"
          code: "STUINC"
          contact_id: "EVAL: registry['contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create incident"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: 2026-07-01
          student_id: "EVAL: registry['student'].id"
          incident_type_id: "EVAL: registry['incident_type'].id"
          description: "Student was involved in a bullying incident during recess."

      - step: "Assert incident created in draft"
        action: "assert"
        target: "incident"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
          handling_level:
            type: "value"
            operator: "is_falsy"

      - step: "Confirm incident"
        action: "call"
        target: "incident"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve incident"
        action: "call"
        target: "incident"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert document number generated"
        action: "assert"
        target: "incident"
        asserts:
          name:
            type: "value"
            operator: "contains"
            expected: "INC"

      - step: "Done incident"
        action: "call"
        target: "incident"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

