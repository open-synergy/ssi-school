        save_as: "grade_class"
        values:
          name: "Class for Incident Onchange Enrollment Test"
          code: "CLINCOCE"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "Year for Incident Onchange Enrollment Test"
          code: "AYINCOCE"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Term for Incident Onchange Enrollment Test"
          code: "TMINCOCE"
          date_start: "2024-07-01"
          date_end: "2024-12-31"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Incident Onchange Enrollment Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Incident Onchange Enrollment"
          code: "STUINCOCE"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Setup - create enrollment for that student"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          grade_class_id: "REC: grade_class.id"
          student_id: "REC: student.id"

      - step: "Open the enrollment so it becomes the student's active one"
        action: "write"
        target: "enrollment"
        values:
          state: "open"

      - step: "Assert the enrollment is now the student's active enrollment"
        action: "assert"
        target: "student"
        asserts:
          active_enrollment_id:
            type: "m2o"
            expected: "REC: enrollment"

      - step: "Selecting the student fills the incident's enrollment"
        action: "form"
        model: "school_incident"
        save: false
        values:
          student_id: "REC: student"
        asserts:
          enrollment_id:
            type: "m2o"
            expected: "REC: enrollment"

