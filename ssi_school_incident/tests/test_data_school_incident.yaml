  - name: "Resolution Status Requires A Resolution Date"
    steps:
      - step: "Setup - create incident type"
        action: "create"
        model: "school_incident_type"
        save_as: "incident_type"
        values:
          name: "Resolution Constraint Case"
          code: "INCTYPE-OC-RESOLUTION"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type for Resolution Constraint Test"
          code: "GTINCRES"
          sequence: 10

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School for Resolution Constraint Test"
          code: "SCHINCRES"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Resolution Constraint Student Contact"

      - step: "Setup - create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student for Resolution Constraint"
          code: "STUINCRES"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"

      - step: "Create incident"
        action: "create"
        model: "school_incident"
        save_as: "incident"
        values:
          date_incident: 2026-07-10
          student_id: "REC: student.id"
          incident_type_id: "REC: incident_type.id"
          description: "Case used to verify the resolution constraint."

      - step: "Resolving with a resolution date is accepted"
        action: "write"
        target: "incident"
        values:
          resolution_status: "resolved_satisfied"
          date_resolved: 2026-07-11

      - step: "Assert the incident is recorded as resolved"
        action: "assert"
        target: "incident"
        asserts:
          resolution_status:
            type: "value"
            expected: "resolved_satisfied"
          date_resolved:
            type: "value"
            expected: 2026-07-11

      - step: "Clearing the resolution date while still resolved must be rejected"
        action: "write"
        target: "incident"
        values:
          date_resolved: false
        expect_error:
          type: "UserError"
          message_contains:
            "Resolution Date is empty while Resolution Status is Resolved"

