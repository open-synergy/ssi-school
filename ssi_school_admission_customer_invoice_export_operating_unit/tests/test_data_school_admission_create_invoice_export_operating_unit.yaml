      - step: "Create wizard selecting the OU A admission but operating unit B"
        action: "create"
        model: "school_admission.wizard_create_invoice_export"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          admission_ids:
            - - 6
              - 0
