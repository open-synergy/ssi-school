              - "REC: invoice_a.move_id"

  - name:
      "Wizard On Admission Whose Operating Unit Does Not Match The Selected One Raises
      UserError"
    steps:
      - step: "Setup - create partner for the admission's operating unit"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "Wizard Mismatch OU A Partner"

      - step: "Create operating unit A (the admission's own)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "Wizard Mismatch OU A"
          code: "SAOU5A"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou_a_partner.id"

      - step: "Setup - create partner for the operating unit selected in the wizard"
        action: "create"
        model: "res.partner"
        save_as: "ou_b_partner"
        values:
          name: "Wizard Mismatch OU B Partner"

      - step: "Create operating unit B (the one selected in the wizard)"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Wizard Mismatch OU B"
          code: "SAOU5B"
          company_id: "REF: base.main_company"
          partner_id: "REC: ou_b_partner.id"

      - step: "Setup - get sale journal"
        action: "search"
