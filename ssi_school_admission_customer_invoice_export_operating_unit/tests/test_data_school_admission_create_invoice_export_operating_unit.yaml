        method: "action_create_invoice_export"
        expect_error:
          type: "UserError"
          message_contains: "operating unit"

      - step: "Assert no customer invoice export document was created for OU B"
        action: "search"
        model: "customer_invoice_export"
        domain: [["operating_unit_id", "=", "REC: ou_b.id"]]
        save_as: "no_export_doc"
        expect_count: 0
