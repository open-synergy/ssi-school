      - step: "Assert allergy listed on student"
        action: "assert"
        target: "student"
        asserts:
          allergy_ids:
            type: "o2m"
            check: "contains"
            expected_records:
              - "REC: allergy"
      - step: "Assert the same allergy listed on contact"
        action: "assert"
        target: "contact"
        asserts:
          allergy_ids:
            type: "o2m"
            check: "contains"
            expected_records:
              - "REC: allergy"

