  - name: "Changing Contact Changes Student Health Value"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type School Health Switch"
          code: "GTSHSW"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Health Switch"
          code: "SCHSHSW"
          grade_type_id: "REC: grade_type.id"
      - step: "Create first contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_a"
        values:
          name: "School Health Switch Contact A"
      - step: "Create second contact"
        action: "create"
        model: "res.partner"
        save_as: "contact_b"
        values:
          name: "School Health Switch Contact B"
      - step: "Create height for first contact"
        action: "create"
        model: "partner.height"
        save_as: "height_a"
        values:
          partner_id: "REC: contact_a.id"
          date: 2026-01-01
          value: 140.0
      - step: "Create height for second contact"
        action: "create"
        model: "partner.height"
        save_as: "height_b"
        values:
          partner_id: "REC: contact_b.id"
          date: 2026-01-01
          value: 160.0
      - step: "Create student on first contact"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "School Health Switch Student"
          code: "STUSHSW"
          contact_id: "REC: contact_a.id"
          school_id: "REC: school.id"
      - step: "Assert student height follows first contact"
        action: "assert"
        target: "student"
        refresh: true
        asserts:
          height:
            type: "value"
            expected: 140.0
      - step: "Move student to second contact"
        action: "write"
        target: "student"
        values:
          contact_id: "REC: contact_b.id"
      - step: "Assert student height follows second contact"
        action: "assert"
        target: "student"
        refresh: true
        asserts:
          height:
            type: "value"
            expected: 160.0
          contact_id.height:
            type: "value"
            expected: 160.0

  - name: "Reject Zero Height Value Created Via Student"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type School Health Zero"
          code: "GTSHZR"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Health Zero"
          code: "SCHSHZR"
          grade_type_id: "REC: grade_type.id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "School Health Zero Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "School Health Zero Student"
          code: "STUSHZR"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"
      - step: "Zero height value must be rejected"
        action: "write"
        target: "student"
        expect_error:
          type: "UserError"
          message_contains: "Value must be greater than zero"
        values:
          height_ids:
            - - 0
              - 0
              - date: 2026-01-01
                value: 0.0

