        model: "school"
        save_as: "school"
        values:
          name: "School Health Latest Height"
          code: "SCHSHLH"
          grade_type_id: "REC: grade_type.id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "School Health Latest Height Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "School Health Latest Height Student"
          code: "STUSHLH"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"
      - step: "Add two height measurements via student"
        action: "write"
        target: "student"
        values:
          height_ids:
            - - 0
              - 0
              - date: 2026-01-01
                value: 140.0
            - - 0
              - 0
              - date: 2026-06-01
                value: 150.0
      - step: "Invalidate student cache before reading latest height"
        action: "call"
        target: "student"
        method: "invalidate_cache"
      - step: "Assert latest height on student and contact"
        action: "assert"
        target: "student"
        asserts:
          height_ids:
            type: "o2m"
            check: "count"
            expected_count: 2
          height:
            type: "value"
            expected: 150.0
          contact_id.height:
            type: "value"
            expected: 150.0

