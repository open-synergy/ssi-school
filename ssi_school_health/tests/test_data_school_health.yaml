scenarios:
  - name: "Height Created Via Student Belongs To Contact"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type School Health Height"
          code: "GTSHHG"
          sequence: 10
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Health Height"
          code: "SCHSHHG"
          grade_type_id: "REC: grade_type.id"
      - step: "Create contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "School Health Height Contact"
      - step: "Create student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "School Health Height Student"
          code: "STUSHHG"
          contact_id: "REC: contact.id"
          school_id: "REC: school.id"
      - step: "Add height measurement via student"
        action: "write"
        target: "student"
        values:
          height_ids:
            - - 0
              - 0
              - date: 2026-01-01
                value: 140.0
      - step: "Assert height line reflected on student"
        action: "assert"
        target: "student"
        asserts:
          height_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
      - step: "Assert height line reflected on contact"
        action: "assert"
        target: "contact"
        asserts:
          height_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
      - step: "Find height line owned by contact"
        action: "search"
        model: "partner.height"
        domain:
          - ["partner_id", "=", "REC: contact.id"]
        save_as: "height_line"
        expect_count: 1
      - step: "Assert height line partner is the student contact"
        action: "assert"
        target: "height_line"
        asserts:
          partner_id:
            type: "m2o"
            expected: "REC: contact"
          value:
            type: "value"
            expected: 140.0

  - name: "Latest Height Wins On Student"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type School Health Latest Height"
          code: "GTSHLH"
          sequence: 10
      - step: "Create school"
