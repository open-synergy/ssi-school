          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          student_id: "EVAL: registry['student'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert enrollment has operating unit"
        action: "assert"
        target: "enrollment"
        asserts:
          state:
            type: "value"
            expected: "draft"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

  - name: "School Operating Unit - Homeroom operating unit propagates to enrollment"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Homeroom OU"
          code: "GTOU04"
          sequence: 10

      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Homeroom OU Test"
          code: "SCHOU04"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Homeroom OU"
          code: "GOU04"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Create grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class"
        values:
          name: "Grade Class Homeroom OU"
          code: "GCOU04"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 5

      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2025/2026 Homeroom OU"
          code: "AYOU04"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create academic term (first term, enrollment open)"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Homeroom OU"
          code: "SMOU04"
          date_start: "2025-07-01"
          date_end: "2025-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Homeroom OU Test"

      - step: "Create school student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Homeroom OU"
          code: "STOU04"
          contact_id: "EVAL: registry['student_contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create homeroom with operating unit"
        action: "create"
        model: "school_homeroom"
        save_as: "homeroom"
        values:
          date: "2025-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class'].id"
          capacity: 5
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert homeroom has operating unit"
        action: "assert"
        target: "homeroom"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

      - step: "Confirm homeroom"
        action: "call"
        target: "homeroom"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Invalidate homeroom cache before approve"
        action: "call"
        target: "homeroom"
        method: "invalidate_cache"

      - step: "Approve homeroom"
        action: "call"
        target: "homeroom"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Select the student as candidate"
        action: "write"
        target: "homeroom"
        values:
          candidate_student_ids:
            - - 6
              - 0
              - - "EVAL: registry['student'].id"

      - step: "Generate enrollments synchronously"
        action: "call"
        target: "homeroom"
        method: "action_generate_enrollments"
        context:
          queue_job__no_delay: true

      - step: "Search generated enrollment for the candidate student"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["homeroom_id", "=", "EVAL: registry['homeroom'].id"]
          - ["student_id", "=", "EVAL: registry['student'].id"]
        save_as: "enrollment"
        expect_count: 1

      - step: "Assert generated enrollment inherited the homeroom's operating unit"
        action: "search"
        model: "school_enrollment"
        domain:
          - ["id", "=", "EVAL: registry['enrollment'].id"]
          - ["operating_unit_id", "=", "EVAL: registry['operating_unit'].id"]
        save_as: "enrollment_with_matching_ou"
        expect_count: 1

  - name: "School Operating Unit - Student Class Mutation operating unit"
    steps:
      - step: "Get main company operating unit"
        action: "search"
        model: "operating.unit"
        domain: [["company_id", "=", "REF: base.main_company"]]
        save_as: "operating_unit"
        limit: 1

      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Mutation OU"
          code: "GTOU05"
          sequence: 10

      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Mutation OU Test"
          code: "SCHOU05"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Mutation OU"
          code: "GOU05"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Create source grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_source"
        values:
          name: "Class A Mutation OU"
          code: "GCOU05A"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create destination grade class"
        action: "create"
        model: "school_grade_class"
        save_as: "grade_class_destination"
        values:
          name: "Class B Mutation OU"
          code: "GCOU05B"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          capacity: 30

      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2025/2026 Mutation OU"
          code: "AYOU05"
          date_start: "2025-07-01"
          date_end: "2026-06-30"

      - step: "Create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester 1 Mutation OU"
          code: "SMOU05"
          date_start: "2025-07-01"
          date_end: "2025-12-31"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Mutation OU Test"

      - step: "Create school student"
        action: "create"
        model: "school_student"
        save_as: "student"
        values:
          name: "Student Mutation OU"
          code: "STOU05"
          contact_id: "EVAL: registry['student_contact'].id"
          school_id: "EVAL: registry['school'].id"

      - step: "Create enrollment in source class with operating unit"
        action: "create"
        model: "school_enrollment"
        save_as: "enrollment"
        as_user: "base.user_admin"
        values:
          date: "2025-07-15"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          grade_class_id: "EVAL: registry['grade_class_source'].id"
          student_id: "EVAL: registry['student'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Confirm enrollment"
        action: "call"
        target: "enrollment"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate enrollment cache before approve"
        action: "call"
        target: "enrollment"
        method: "invalidate_cache"

      - step: "Approve enrollment"
        action: "call"
        target: "enrollment"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create class mutation with operating unit"
        action: "create"
        model: "school_student_mutation"
        save_as: "mutation"
        values:
          date: "2025-08-01"
          student_id: "EVAL: registry['student'].id"
          enrollment_id: "EVAL: registry['enrollment'].id"
          destination_grade_class_id: "EVAL: registry['grade_class_destination'].id"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert mutation has operating unit"
        action: "assert"
        target: "mutation"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
