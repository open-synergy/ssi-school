options:
  auto_refresh: true

scenarios:
  - name:
      "Populate Allocation fills one row from an invoiced admission payment term,
      counted only on that term"
    steps:
      - step: "Get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type"
      - step: "Get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type"
      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          code: "SAP1-INC"
          name: "School Admission Promotion Test 1 Income"
          user_type_id: "REC: revenue_type.id"
      - step: "Create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          code: "SAP1-RECV"
          name: "School Admission Promotion Test 1 Receivable"
          user_type_id: "REC: receivable_type.id"
          reconcile: true
      - step: "Create sales journal"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "School Admission Promotion Test 1 Journal"
          code: "SAP1J"
          type: "sale"
      - step: "Create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "School Admission Promotion Test 1 Invoice Type"
          code: "SAP1CIT"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
      - step: "Create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "School Admission Promotion Test 1 Product"
          type: "service"
          list_price: 1000000.0
          property_account_income_id: "REC: income_account.id"
      - step: "Create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "School Admission Promotion Test 1 Pricelist"
          currency_id: "REC: company.currency_id.id"
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "School Admission Promotion Test 1 Grade Type"
          code: "SAP1GT"
          sequence: 10
      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 SAP1"
          code: "SAP1AY"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
      - step: "Create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester SAP1"
          code: "SAP1AT"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"
      - step: "Create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School SAP1"
          code: "SAP1SCH"
          grade_type_id: "REC: grade_type.id"
      - step: "Create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade SAP1"
          code: "SAP1G"
          sequence: 10
          type_id: "REC: grade_type.id"
      - step: "Create the student partner on the same receivable account"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact SAP1"
          property_account_receivable_id: "REC: receivable_account.id"
      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"
          pricelist_id: "REC: pricelist.id"
          receivable_journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"
          customer_invoice_type_id: "REC: ci_type.id"
          auto_confirm_customer_invoice: false
          # WAJIB (jebakan T-05): record rule
          # school_admission_internal_user_rule berlaku atas base.group_user
          # dengan domain [('user_id','=',user.id)], dan base.user_admin
          # BUKAN anggota school_admission_all_group -- beda dari
          # customer_invoice_all_group yang memang memuatnya. Tanpa baris ini
          # admission ini dimiliki superuser, sehingga setiap pembacaan ulang
          # di env as_user (termasuk assert yang menempel pada step
          # action_approve_approval) berakhir AccessError.
          user_id: "REF: base.user_admin"
      - step: "Create payment term A"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_a"
        values:
          admission_id: "REC: admission.id"
          name: "Term A SAP1"
          sequence: 10
          date_invoice: "2024-07-05"
          date_due: "2024-07-20"
      - step: "Create payment term A detail"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail_a"
        values:
          term_id: "REC: term_a.id"
          product_id: "REC: product.id"
          name: "Registration Fee SAP1"
          account_id: "REC: income_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0
      - step: "Create sibling payment term B (left uninvoiced)"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_b"
        values:
          admission_id: "REC: admission.id"
          name: "Term B SAP1"
          sequence: 20
          date_invoice: "2024-08-05"
          date_due: "2024-08-20"
      - step: "Confirm admission"
        action: "call"
        target: "admission"
        method: "action_confirm"
        as_user: "base.user_admin"
      - step: "Assert admission is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "admission"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve admission"
        action: "call"
        target: "admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Create customer invoice from term A"
        action: "call"
        target: "term_a"
        method: "action_create_invoice"
        as_user: "base.user_admin"
      - step: "Find the customer invoice created for term A"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_a.customer_invoice_id.id"]]
        save_as: "invoice_a"
        expect_count: 1
      - step: "Confirm the customer invoice"
        action: "call"
        target: "invoice_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Assert invoice is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "invoice_a"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve the customer invoice"
        action: "call"
        target: "invoice_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Find the invoice's own receivable move line"
        action: "search"
        model: "account.move.line"
        domain: [["id", "=", "REC: invoice_a.receivable_move_line_id.id"]]
        save_as: "move_line_a"
        expect_count: 1
      - step: "Assert the receivable line's residual"
        action: "assert"
        target: "move_line_a"
        asserts:
          amount_residual:
            type: "value"
            expected: 1000000.0
      - step: "Find school_admission_payment_term model"
        action: "search"
        model: "ir.model"
        domain: [["model", "=", "school_admission_payment_term"]]
        save_as: "sapt_model"
        limit: 1
        expect_count: 1
      - step:
          "Create promotion type allowing school_admission_payment_term as reference"
        action: "create"
        model: "promotion_type"
        save_as: "ptype"
        values:
          name: "School Admission Promotion Test 1 Type"
          code: "/"
          discount_usage_id:
            "REF: ssi_product_usage_account_type.product_usage_type_income"
          account_id: "REC: income_account.id"
          discount_type: "fixed"
          discount_amount: 100000.0
          journal_id: "REC: journal.id"
          product_id: "REC: product.id"
          allowed_model_ids:
            - - 6
              - 0
              - - "REC: sapt_model.id"
      - step: "Create promotion code"
        action: "create"
        model: "promotion_code"
        save_as: "code"
        values:
          voucher_code: "SAP1-001"
          type_id: "REC: ptype.id"
          user_id: "REF: base.user_admin"
      - step: "Confirm promotion code"
        action: "call"
        target: "code"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Refresh code before approval (fresh policy field read)"
        action: "assert"
        target: "code"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve promotion code"
        action: "call"
        target: "code"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Assert term A has no promotion usage yet"
        action: "assert"
        target: "term_a"
        asserts:
          promotion_usage_count:
            type: "value"
            expected: 0
      - step: "Create a draft usage referencing term A"
        action: "create"
        model: "promotion_code_usage"
        save_as: "usage"
        values:
          promotion_code_id: "REC: code.id"
          partner_id: "REC: contact.id"
          user_id: "REF: base.user_admin"
          document_reference:
            "EVAL: 'school_admission_payment_term,%d' % registry['term_a'].id"
      - step: "Run Populate Allocation on the usage"
        action: "call"
        target: "usage"
        method: "action_populate_allocation"
        as_user: "base.user_admin"
      - step: "Exactly one allocation row is created"
        action: "search"
        model: "promotion_code_usage_allocation"
        domain: [["usage_id", "=", "REC: usage.id"]]
        save_as: "alloc_row"
        expect_count: 1
      - step: "The allocation row targets term A's own receivable line"
        action: "assert"
        target: "alloc_row"
        asserts:
          source:
            type: "value"
            expected: "customer"
          move_line_id:
            type: "m2o"
            expected: "REC: move_line_a"
      - step: "Term A now counts the new usage"
        action: "assert"
        target: "term_a"
        asserts:
          promotion_usage_count:
            type: "value"
            expected: 1
          promotion_usage_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: usage"
      - step: "Sibling term B still counts zero"
        action: "assert"
        target: "term_b"
        asserts:
          promotion_usage_count:
            type: "value"
            expected: 0

