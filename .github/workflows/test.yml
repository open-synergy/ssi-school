name: tests

on:
  pull_request:
    branches:
      - "14.0*"
  push:
    branches:
      - "14.0"
      - "14.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.6-odoo14.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.6-ocb14.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install odoo-yaml-test from git
        run: pip install git+https://github.com/andhit-r/odoo-yaml-test.git@master#egg=odoo-yaml-test
      - name: Install addons and dependencies
        run: oca_install_addons
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: https://${{ secrets.SSI_PYPI_USER }}:${{ secrets.SSI_PYPI_PASSWORD }}@osmium.simetri-sinergi.biz.id/simple/
      - name: Pre-install chart of accounts
        # Memasang l10n_generic_coa ke DB test SEBELUM `oca_init_test_database`.
        # Saat modul ini berstatus `to install`, pemeriksaan `to_install_l10n`
        # (account/__init__.py) bernilai benar sehingga `_auto_install_l10n`
        # berhenti tanpa memasang l10n_us; chart of accounts juga sudah termuat
        # sebelum demo modul SSI lahir, sehingga `chart_template._load()` tidak
        # pernah menghapus account.journal/account.account yang dirujuk demo.
        # Demo TIDAK dimatikan: tour dan skenario uji bergantung padanya.
        run: |
          oca_wait_for_postgres
          odoo -d "$PGDATABASE" -i l10n_generic_coa --http-interface=127.0.0.1 --stop-after-init
      - name: Pre-install ssi_promotion
        # ssi_school_promotion (open-synergy/ssi-school#306) adalah modul pertama di
        # repo ini yang depends ke ssi_promotion (repo open-synergy/ssi-promotion).
        # `manifestoo --select-addons-dir . list-depends` yang dipakai
        # `oca_init_test_database` hanya membaca manifest modul DI REPO INI, jadi ia
        # tidak bisa melihat dependensi ssi_promotion sendiri (mis.
        # ssi_transaction_partner_mixin, ssi_transaction_date_duration_mixin) --
        # keduanya memang tetap ter-install lewat cascade `button_install()` biasa.
        # Tanpa langkah eksplisit ini, `oca_run_tests` (yang meng-install addons repo
        # ini SENDIRIAN lewat `-i`, tanpa ssi_promotion disebut) berakhir dengan
        # `TypeError: Model 'school_enrollment_payment_term' inherits from
        # non-existing model 'mixin.promotion_object'` -- ssi_promotion sudah
        # `state=installed` dari langkah di atas, tapi modelnya tidak ikut termuat ke
        # registry proses `oca_run_tests` yang terpisah. Meng-install-nya di sini,
        # sendirian, SEBELUM `oca_init_test_database`, memastikan seluruh rantai
        # dependensinya (termasuk yang tidak terlihat oleh manifestoo) sudah bersih
        # ter-install sebelum alur dua-tahap standar berjalan.
        run: |
          oca_wait_for_postgres
          odoo -d "$PGDATABASE" -i ssi_promotion --http-interface=127.0.0.1 --stop-after-init
      - name: Check licenses
        run: manifestoo -d . check-licenses
        continue-on-error: true
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
        continue-on-error: true
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - name: Upload screenshots from JS tests
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: Screenshots of failed JS tests - ${{ matrix.name }}${{ join(matrix.include) }}
          path: /tmp/odoo_tests/${{ env.PGDATABASE }}
          if-no-files-found: ignore
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'open-synergy' }}
