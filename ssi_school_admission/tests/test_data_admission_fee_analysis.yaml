options:
  auto_refresh: true

scenarios:
  - name: "One detail creates exactly one fully-dimensioned analysis row"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "revenue_type"

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "receivable_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Admission Fee Income AFA1"
          code: "AFA14200"
          user_type_id: "REC: revenue_type.id"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "Admission Receivable AFA1"
          code: "AFA11100"
          user_type_id: "REC: receivable_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type AFA1"
          code: "CITAFA1"
          journal_id: "REC: journal.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Admission Fee AFA1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AFA1"
          code: "GTAFA1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2027/2028 AFA1"
          code: "AYAFA1"
          date_start: "2027-07-01"
          date_end: "2028-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester AFA1"
          code: "SMAFA1"
          date_start: "2027-07-01"
          date_end: "2028-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School AFA1"
          code: "SCHAFA1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade AFA1"
          code: "GAFA1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact AFA1"

      - step: "Setup - create payment template (encodes the Internal track)"
        action: "create"
        model: "school_admission_payment_template"
        save_as: "payment_template"
        values:
          name: "Admission Payment Template AFA1 - Internal"
          code: "APTAFA1"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          customer_invoice_type_id: "REC: ci_type.id"

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          date: "2027-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"
          user_id: "REF: base.user_admin"
          payment_template_id: "REC: payment_template.id"

      - step: "Create payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term"
        values:
          admission_id: "REC: admission.id"
          name: "Term AFA1"
          sequence: 10

      - step: "Create the only detail"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee AFA1"
          account_id: "REC: income_account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Find the analysis row for this detail"
        action: "search"
        model: "school_admission_fee_analysis"
        domain: [["detail_id", "=", "REC: detail.id"]]
        save_as: "row"
        expect_count: 1

      - step: "Assert the row carries every dimension from the source records"
        action: "assert"
        target: "row"
        asserts:
          price_subtotal:
            type: "value"
            expected: 1000000.0
          price_total:
            type: "value"
            expected: 1000000.0
          admission_id:
            type: "m2o"
            expected: "REC: admission"
          school_id:
            type: "m2o"
            expected: "REC: school"
          academic_year_id:
            type: "m2o"
            expected: "REC: academic_year"
          academic_term_id:
            type: "m2o"
            expected: "REC: academic_term"
          grade_id:
            type: "m2o"
            expected: "REC: grade"
          product_id:
            type: "m2o"
            expected: "REC: product"
          payment_template_id:
            type: "m2o"
            expected: "REC: payment_template"
          term_state:
            type: "value"
            expected: "draft"
          admission_state:
            type: "value"
            expected: "draft"
          admission_payment_status:
            type: "value"
            expected: "unpaid"

  - name: "Two payment terms of the same admission produce two separate rows"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AFA2"
          code: "GTAFA2"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2027/2028 AFA2"
          code: "AYAFA2"
          date_start: "2027-07-01"
          date_end: "2028-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester AFA2"
          code: "SMAFA2"
          date_start: "2027-07-01"
          date_end: "2028-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School AFA2"
          code: "SCHAFA2"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade AFA2"
          code: "GAFA2"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact AFA2"

      - step: "Setup - create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income AFA2"
          code: "AFA24200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Admission Fee AFA2"
          type: "service"
          list_price: 500000.0

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          date: "2027-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"
          user_id: "REF: base.user_admin"

      - step: "Create first payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_1"
        values:
          admission_id: "REC: admission.id"
          name: "Term AFA2 A"
          sequence: 10

      - step: "Create detail on the first term"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail_1"
        values:
          term_id: "REC: term_1.id"
          product_id: "REC: product.id"
          name: "Fee AFA2 A"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 500000.0

      - step: "Create second payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_2"
        values:
          admission_id: "REC: admission.id"
          name: "Term AFA2 B"
          sequence: 20

      - step: "Create detail on the second term"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail_2"
        values:
          term_id: "REC: term_2.id"
          product_id: "REC: product.id"
          name: "Fee AFA2 B"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 500000.0

      - step: "Both fee lines appear as two separate, unaggregated rows"
        action: "search"
        model: "school_admission_fee_analysis"
        domain: [["admission_id", "=", "REC: admission.id"]]
        save_as: "rows"
        expect_count: 2

  - name: "Voided and unlinked details never appear in the analysis"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AFA3"
          code: "GTAFA3"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2027/2028 AFA3"
          code: "AYAFA3"
          date_start: "2027-07-01"
          date_end: "2028-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester AFA3"
          code: "SMAFA3"
          date_start: "2027-07-01"
          date_end: "2028-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School AFA3"
          code: "SCHAFA3"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade AFA3"
          code: "GAFA3"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact AFA3"

      - step: "Setup - create account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income AFA3"
          code: "AFA34200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Admission Fee AFA3"
          type: "service"
          list_price: 1000000.0

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          date: "2027-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"
          user_id: "REF: base.user_admin"

      - step: "Create payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term"
        values:
          admission_id: "REC: admission.id"
          name: "Term AFA3"
          sequence: 10

      - step: "Create the voided detail"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "voided_detail"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee AFA3 Voided"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0
          voided: true

      - step: "The voided detail has no analysis row"
        action: "search"
        model: "school_admission_fee_analysis"
        domain: [["detail_id", "=", "REC: voided_detail.id"]]
        save_as: "voided_rows"
        expect_count: 0

      - step: "Create a second, unvoided detail"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "live_detail"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee AFA3 Live"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "The unvoided detail has exactly one analysis row"
        action: "search"
        model: "school_admission_fee_analysis"
        domain: [["detail_id", "=", "REC: live_detail.id"]]
        save_as: "live_rows"
        expect_count: 1

      - step: "Unlink the previously-live detail"
        action: "unlink"
        target: "live_detail"

      - step: "The row disappears once the detail is unlinked"
        action: "search"
        model: "school_admission_fee_analysis"
        domain: [["detail_id", "=", "EVAL: registry['live_detail'].id"]]
        save_as: "live_rows_after_unlink"
        expect_count: 0
