      - step: "Assert draft admission may create a student profile"
        action: "assert"
        target: "admission"
        asserts:
          create_student_ok:
            type: "value"
            expected: true
          school_student_id:
            type: "value"
            operator: "is_falsy"
      - step: "Confirm admission"
        action: "call"
        target: "admission"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Create student profile while waiting for approval"
        action: "call"
        target: "admission"
        method: "action_create_school_student"
        as_user: "base.user_admin"
        asserts:
          school_student_id:
            type: "value"
            operator: "is_truthy"
      - step: "Search the student profile of the admission contact"
        action: "search"
        model: "school_student"
        domain: [["contact_id", "=", "REC: student_contact.id"]]
        save_as: "early_student"
        expect_count: 1

      - step: "Assert admission is linked to that student profile"
        action: "assert"
        target: "admission"
        asserts:
          school_student_id:
            type: "m2o"
            expected: "REC: early_student"

      - step: "Approve admission (moves to open)"
        action: "call"
        target: "admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the same student profile is still linked"
        action: "assert"
        target: "admission"
        asserts:
          school_student_id:
            type: "m2o"
            expected: "REC: early_student"

      - step: "Search student profiles of the contact"
        action: "search"
        model: "school_student"
        domain: [["contact_id", "=", "REC: student_contact.id"]]
        save_as: "students"
        expect_count: 1

