options:
  auto_refresh: true

scenarios:
  - name: "Create student profile from a draft admission"
    steps:
      - step: "Setup - get receivable journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "receivable_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Receivable CSP1"
          code: "CSP1"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "Pricelist CSP1"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type CSP1"
          code: "GTCSP1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 CSP1"
          code: "AYCSP1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester CSP1"
          code: "SMCSP1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School CSP1"
          code: "SCHCSP1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade CSP1"
          code: "GCSP1"
          sequence: 20
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Contact CSP1"

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact.id"
          currency_id: "REC: company.currency_id.id"
          pricelist_id: "REC: pricelist.id"
          receivable_journal_id: "REC: receivable_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Assert draft admission may create a student profile"
        action: "assert"
        target: "admission"
        asserts:
          create_student_ok:
            type: "value"
            expected: true
          school_student_id:
            type: "value"
            operator: "is_falsy"
      - step: "Create student profile"
        action: "call"
        target: "admission"
        method: "action_create_school_student"
        as_user: "base.user_admin"
        asserts:
          school_student_id:
            type: "value"
            operator: "is_truthy"
      - step: "Search the student profile of the admission contact"
        action: "search"
        model: "school_student"
        domain: [["contact_id", "=", "REC: student_contact.id"]]
        save_as: "early_student"
        expect_count: 1

      - step: "Assert admission is linked to that student profile"
        action: "assert"
        target: "admission"
        asserts:
          school_student_id:
            type: "m2o"
            expected: "REC: early_student"

