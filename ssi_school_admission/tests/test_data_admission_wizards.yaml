  - name:
      "Wizard Form - Onchange sets and resets Customer Invoice Type and Auto Confirm"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable WZOC"
          code: "WZOC4200"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type WZOC"
          code: "CITWZOC"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - create payment template with auto confirm"
        action: "create"
        model: "school_admission_payment_template"
        save_as: "payment_template"
        values:
          name: "Payment Template WZOC"
          code: "PTWZOC"
          customer_invoice_type_id: "REC: ci_type.id"
          auto_confirm_customer_invoice: true

      - step: "Fill form and pick payment template"
        action: "form"
        model: "school_admission_form.wizard_create_admission"
        save: false
        ops:
          - set:
              payment_template_id: "REC: payment_template"
          - assert:
              customer_invoice_type_id:
                type: "value"
                operator: "is_truthy"
              auto_confirm_customer_invoice:
                type: "value"
                expected: true

      - step: "Clear payment template and confirm both fields reset"
        action: "form"
        model: "school_admission_form.wizard_create_admission"
        save: false
        ops:
          - set:
              payment_template_id: "REC: payment_template"
          - set:
              payment_template_id: "EVAL: self.env['school_admission_payment_template']"
          - assert:
              customer_invoice_type_id:
                type: "value"
                operator: "is_falsy"
              auto_confirm_customer_invoice:
                type: "value"
                expected: false

