      - step: "Invalidate admission cache"
        action: "call"
        target: "admission"
        method: "invalidate_cache"

      - step: "Assert summary ada sebelum term dihapus"
        action: "assert"
        target: "admission"
        asserts:
          product_summary_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step: "Hapus term (cascade hapus detail)"
        action: "call"
        target: "term"
        method: "unlink"

      - step: "Invalidate admission cache setelah hapus term"
        action: "call"
        target: "admission"
        method: "invalidate_cache"

      - step: "Assert summary kosong setelah term dihapus"
        action: "assert"
        target: "admission"
        asserts:
          product_summary_ids:
            type: "o2m"
            check: "count"
            expected_count: 0
