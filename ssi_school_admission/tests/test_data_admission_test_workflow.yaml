options:
  auto_refresh: true

scenarios:
  - name: "Admission Test - Full Workflow Confirm Approve Open Done"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Admission Test Workflow"
          code: "GTATW"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Admission Test Workflow"
          code: "AYATW"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester Admission Test Workflow"
          code: "SMATW"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Admission Test Workflow"
          code: "SCHATW"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Admission Test Workflow"
          code: "GATW"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Contact Admission Test Workflow"

      - step: "Create admission test"
        action: "create"
        model: "school_admission_test"
        save_as: "admission_test"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          student_id: "EVAL: registry['student_contact'].id"

      - step: "Assert admission test created in draft"
        action: "assert"
        target: "admission_test"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm admission test"
        action: "call"
        target: "admission_test"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve admission test"
        action: "call"
        target: "admission_test"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Set passed to True"
        action: "write"
        target: "admission_test"
        values:
          passed: true

      - step: "Done admission test"
        action: "call"
        target: "admission_test"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert admission test passed"
        action: "assert"
        target: "admission_test"
        asserts:
          passed:
            type: "value"
            expected: true

  - name: "Admission Test - Created Without Admission Form"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Admission Test No Form"
          code: "GTATNF"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Admission Test No Form"
          code: "AYATNF"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester Admission Test No Form"
          code: "SMATNF"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "EVAL: registry['academic_year'].id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Admission Test No Form"
          code: "SCHATNF"
          grade_type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Admission Test No Form"
          code: "GATNF"
          sequence: 10
          type_id: "EVAL: registry['grade_type'].id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Contact Admission Test No Form"

      - step: "Create admission test without form"
        action: "create"
        model: "school_admission_test"
        save_as: "admission_test"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "EVAL: registry['academic_year'].id"
          academic_term_id: "EVAL: registry['academic_term'].id"
          school_id: "EVAL: registry['school'].id"
          grade_id: "EVAL: registry['grade'].id"
          student_id: "EVAL: registry['student_contact'].id"

      - step: "Assert admission test has no form"
        action: "assert"
        target: "admission_test"
        asserts:
          admission_form_id:
            type: "value"
            operator: "is_falsy"

  - name: "Admission Test - One Admission Form Yields At Most One Admission Test"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "journal"
        limit: 1

      - step: "Setup - get revenue account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income Uniqueness Test"
          code: "ADUNIQ4200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create pricelist"
        action: "create"
        model: "product.pricelist"
        save_as: "pricelist"
        values:
          name: "Pricelist ADUNIQ"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type Uniqueness"
          code: "GTUNIQ"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 Uniqueness"
          code: "AYUNIQ"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester Uniqueness"
          code: "SMUNIQ"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School Uniqueness"
          code: "SCHUNIQ"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade Uniqueness"
          code: "GUNIQ"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Uniqueness"

      - step: "Setup - create parent contact"
        action: "create"
        model: "res.partner"
        save_as: "parent_contact"
        values:
          name: "Parent Uniqueness"

      - step: "Setup - create admission form"
        action: "create"
        model: "school_admission_form"
        save_as: "admission_form"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact.id"
          parent_id: "REC: parent_contact.id"
          pricelist_id: "REC: pricelist.id"
          currency_id: "REC: company.currency_id.id"
          journal_id: "REC: journal.id"
          account_id: "REC: account.id"

      - step: "Create the first admission test on that admission form"
        action: "create"
        model: "school_admission_test"
        save_as: "admission_test"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact.id"
          admission_form_id: "REC: admission_form.id"

      - step: "A second admission test on the same admission form is rejected"
        action: "create"
        model: "school_admission_test"
        expect_error:
          type: "ValidationError"
          message_contains: "already has an Admission Test"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact.id"
          admission_form_id: "REC: admission_form.id"
