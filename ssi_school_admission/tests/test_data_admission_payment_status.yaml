options:
  auto_refresh: true
scenarios:
  - name: "Two uninvoiced terms yield unpaid status"
    steps:
      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type PAT1"
          code: "GTPAT1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 PAT1"
          code: "AYPAT1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester PAT1"
          code: "SMPAT1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School PAT1"
          code: "SCHPAT1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade PAT1"
          code: "GPAT1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact PAT1"

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          user_id: "REF: base.user_admin"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"

      - step: "Setup - create income account"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income PAT1"
          code: "PAT14200"
          user_type_id: "REC: account_type.id"

      - step: "Create first payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_1"
        values:
          admission_id: "REC: admission.id"
          name: "Term 1 PAT1"
          sequence: 10

      - step: "Setup - create product for first term"
        action: "create"
        model: "product.product"
        save_as: "product_1"
        values:
          name: "Admission Fee PAT1 A"
          type: "service"
          list_price: 600000.0

      - step: "Create detail on the first term"
        action: "create"
        model: "school_admission_payment_term_detail"
        values:
          term_id: "REC: term_1.id"
          product_id: "REC: product_1.id"
          name: "Fee PAT1 A"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 600000.0

      - step: "Create second payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_2"
        values:
          admission_id: "REC: admission.id"
          name: "Term 2 PAT1"
          sequence: 20

      - step: "Setup - create product for second term"
        action: "create"
        model: "product.product"
        save_as: "product_2"
        values:
          name: "Admission Fee PAT1 B"
          type: "service"
          list_price: 400000.0

      - step: "Create detail on the second term"
        action: "create"
        model: "school_admission_payment_term_detail"
        values:
          term_id: "REC: term_2.id"
          product_id: "REC: product_2.id"
          name: "Fee PAT1 B"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 400000.0

      - step: "Confirm admission"
        action: "call"
        target: "admission"
        method: "action_confirm"
        as_user: "base.user_admin"

      - step: "Assert admission is confirm before approve (forces refresh, T-04)"
        action: "assert"
        target: "admission"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve admission"
        action: "call"
        target: "admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert the aggregate is unpaid with the full total residual"
        action: "assert"
        target: "admission"
        asserts:
          amount_total:
            type: "value"
            expected: 1000000.0
          amount_paid:
            type: "value"
            expected: 0.0
          amount_residual:
            type: "value"
            expected: 1000000.0
          payment_status:
            type: "value"
            expected: "unpaid"

