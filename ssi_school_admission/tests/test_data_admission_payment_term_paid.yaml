        expect_count: 1

      - step: "Mark the customer invoice as paid"
        action: "write"
        target: "invoice"
        values:
          state: "done"

      - step: "Assert the term is paid before cancelling the admission"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "paid"

      - step:
          "Force the admission into cancel (action_cancel itself refuses while a term is
          invoiced -- see _10_check_payment_term_invoice; this direct write isolates the
          compute-only guarantee under test)"
        action: "write"
        target: "admission"
        values:
          state: "cancel"

      - step:
          "Assert the term follows the admission to cancelled, even though its invoice
          is paid"
        action: "assert"
        target: "term"
        asserts:
          state:
            type: "value"
            expected: "cancelled"
