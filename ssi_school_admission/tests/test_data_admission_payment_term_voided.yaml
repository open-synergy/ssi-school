options:
  auto_refresh: true

scenarios:
  - name: "Voided detail is excluded from the term total"
    steps:
      - step: "Setup - get account type ref"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income ADVD1"
          code: "ADVD14200"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Admission Fee ADVD1"
          type: "service"
          list_price: 1000000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type ADVD1"
          code: "GTADVD1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 ADVD1"
          code: "AYADVD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester ADVD1"
          code: "SMADVD1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School ADVD1"
          code: "SCHADVD1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade ADVD1"
          code: "GADVD1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "contact"
        values:
          name: "Student Contact ADVD1"

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        values:
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: contact.id"
          currency_id: "REC: company.currency_id.id"
          user_id: "REF: base.user_admin"

      - step: "Create payment term"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term"
        values:
          admission_id: "REC: admission.id"
          name: "Term ADVD1"
          sequence: 10

      - step: "Create first detail (not voided)"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail_1"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee ADVD1 A"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0

      - step: "Create second detail (voided)"
        action: "create"
        model: "school_admission_payment_term_detail"
        save_as: "detail_2"
        values:
          term_id: "REC: term.id"
          product_id: "REC: product.id"
          name: "Fee ADVD1 B"
          account_id: "REC: account.id"
          uom_quantity: 1.0
          uom_id: "REF: uom.product_uom_unit"
          price_unit: 1000000.0
          voided: true

      - step: "Assert the term total excludes the voided detail"
        action: "assert"
        target: "term"
        asserts:
          amount_untaxed:
            type: "value"
            expected: 1000000.0
          amount_total:
            type: "value"
            expected: 1000000.0

      - step: "Assert the voided detail keeps its original price_unit"
        action: "assert"
        target: "detail_2"
        asserts:
          price_unit:
            type: "value"
            expected: 1000000.0

