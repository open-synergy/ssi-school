  - name: "Wizard Without Admission Selected Raises UserError"
    steps:
      - step: "Setup - create export type"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "export_type"
        values:
          name: "Export Type AI3"
          code: "ETYAI3"
          default_output_format: "csv"

      - step: "Create wizard without any admission selected"
