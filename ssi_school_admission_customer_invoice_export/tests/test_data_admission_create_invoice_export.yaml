options:
  auto_refresh: true
scenarios:
  - name: "Wizard Exports Only Open Invoiced Moves, Excludes Done And Uninvoiced"
    steps:
      - step: "Setup - get sale journal"
        action: "search"
        model: "account.journal"
        domain: [["type", "=", "sale"]]
        save_as: "ci_journal"
        limit: 1

      - step: "Setup - get receivable account type"
        action: "ref"
        xml_id: "account.data_account_type_receivable"
        save_as: "ci_account_type"

      - step: "Setup - create customer invoice receivable account"
        action: "create"
        model: "account.account"
        save_as: "ci_account"
        values:
          name: "Customer Invoice Receivable AI1"
          code: "RECAI1"
          user_type_id: "REC: ci_account_type.id"
          reconcile: true

      - step: "Setup - create customer invoice type"
        action: "create"
        model: "customer_invoice_type"
        save_as: "ci_type"
        values:
          name: "Customer Invoice Type AI1"
          code: "CITAI1"
          journal_id: "REC: ci_journal.id"
          receivable_account_id: "REC: ci_account.id"

      - step: "Setup - get income account type"
        action: "ref"
        xml_id: "account.data_account_type_revenue"
        save_as: "account_type"

      - step: "Setup - create income account"
        action: "create"
        model: "account.account"
        save_as: "account"
        values:
          name: "Admission Fee Income AI1"
          code: "INCAI1"
          user_type_id: "REC: account_type.id"

      - step: "Setup - create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Admission Fee AI1"
          type: "service"
          list_price: 500000.0

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "Grade Type AI1"
          code: "GTAI1"
          sequence: 10

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "academic_year"
        values:
          name: "2024/2025 AI1"
          code: "AYAI1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"

      - step: "Setup - create academic term"
        action: "create"
        model: "school_academic_term"
        save_as: "academic_term"
        values:
          name: "Semester AI1"
          code: "SMAI1"
          date_start: "2024-07-01"
          date_end: "2025-06-30"
          year_id: "REC: academic_year.id"
          enrollment_state: "open"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "School AI1"
          code: "SCAI1"
          grade_type_id: "REC: grade_type.id"

      - step: "Setup - create grade"
        action: "create"
        model: "school_grade"
        save_as: "grade"
        values:
          name: "Grade AI1"
          code: "GRAI1"
          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact"
        values:
          name: "Student Contact AI1"

      - step: "Create admission"
        action: "create"
        model: "school_admission"
        save_as: "admission"
        as_user: "base.user_admin"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          pricelist_id: "REF: product.list0"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: ci_journal.id"

      - step: "Confirm admission"
        action: "call"
        target: "admission"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Assert admission is approvable before approving"
        action: "assert"
        target: "admission"
        as_user: "base.user_admin"
        asserts:
          approve_ok:
            type: "value"
            expected: true

      - step: "Approve admission"
        action: "call"
        target: "admission"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Assert admission is allowed to create invoice export"
        action: "assert"
        target: "admission"
        asserts:
          create_invoice_export_ok:
            type: "value"
            expected: true

      - step: "Setup - create export type matching every journal/partner/product"
        action: "create"
        model: "customer_invoice_export_type"
        save_as: "export_type"
        values:
          name: "Export Type AI1"
          code: "ETYAI1"
          default_output_format: "csv"

      - step: "Create term Open A"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_open_a"
        values:
          admission_id: "REC: admission.id"
          name: "Term Open A AI1"
          sequence: 10
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                name: "Fee Open A AI1"
                account_id: "REC: account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 500000.0

      - step: "Generate invoice for term Open A"
        action: "call"
        target: "term_open_a"
        method: "action_create_invoice"

      - step: "Fetch invoice generated for term Open A"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_open_a.customer_invoice_id.id"]]
        save_as: "invoice_open_a"
        expect_count: 1

      - step: "Confirm invoice Open A"
        action: "call"
        target: "invoice_open_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Assert invoice_open_a is approvable before approving"
        action: "assert"
        target: "invoice_open_a"
        as_user: "base.user_admin"
        asserts:
          approve_ok:
            type: "value"
            expected: true

      - step: "Approve invoice Open A"
        action: "call"
        target: "invoice_open_a"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create term Open B"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_open_b"
        values:
          admission_id: "REC: admission.id"
          name: "Term Open B AI1"
          sequence: 20
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                name: "Fee Open B AI1"
                account_id: "REC: account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 500000.0

      - step: "Generate invoice for term Open B"
        action: "call"
        target: "term_open_b"
        method: "action_create_invoice"

      - step: "Fetch invoice generated for term Open B"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_open_b.customer_invoice_id.id"]]
        save_as: "invoice_open_b"
        expect_count: 1

      - step: "Confirm invoice Open B"
        action: "call"
        target: "invoice_open_b"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Assert invoice_open_b is approvable before approving"
        action: "assert"
        target: "invoice_open_b"
        as_user: "base.user_admin"
        asserts:
          approve_ok:
            type: "value"
            expected: true

      - step: "Approve invoice Open B"
        action: "call"
        target: "invoice_open_b"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Create term Done (will be fully paid)"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_done"
        values:
          admission_id: "REC: admission.id"
          name: "Term Done AI1"
          sequence: 30
          detail_ids:
            - - 0
              - 0
              - product_id: "REC: product.id"
                name: "Fee Done AI1"
                account_id: "REC: account.id"
                uom_quantity: 1.0
                uom_id: "REF: uom.product_uom_unit"
                price_unit: 500000.0

      - step: "Generate invoice for term Done"
        action: "call"
        target: "term_done"
        method: "action_create_invoice"

      - step: "Fetch invoice generated for term Done"
        action: "search"
        model: "customer_invoice"
        domain: [["id", "=", "REC: term_done.customer_invoice_id.id"]]
        save_as: "invoice_done"
        expect_count: 1

      - step: "Confirm invoice Done"
        action: "call"
        target: "invoice_done"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Assert invoice_done is approvable before approving"
        action: "assert"
        target: "invoice_done"
        as_user: "base.user_admin"
        asserts:
          approve_ok:
            type: "value"
            expected: true

      - step: "Approve invoice Done"
        action: "call"
        target: "invoice_done"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "open"

      - step: "Mark invoice Done as fully paid"
        action: "call"
        target: "invoice_done"
        method: "action_done"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Create term Uninvoiced (never invoiced)"
        action: "create"
        model: "school_admission_payment_term"
        save_as: "term_uninvoiced"
        values:
          admission_id: "REC: admission.id"
          name: "Term Uninvoiced AI1"
          sequence: 40

      - step: "Create wizard for the admission"
        action: "create"
        model: "school_admission.wizard_create_invoice_export"
        save_as: "wizard"
        as_user: "base.user_admin"
        values:
          admission_ids:
            - - 6
              - 0
              - - "REC: admission.id"
          type_id: "REC: export_type.id"
          date: "2024-07-01"
          output_format: "csv"

      - step: "Run create invoice export"
        action: "call"
        target: "wizard"
        method: "action_create_invoice_export"

      - step: "Fetch the created customer invoice export document"
        action: "search"
        model: "customer_invoice_export"
        domain: [["type_id", "=", "REC: export_type.id"]]
        save_as: "export_doc"
        expect_count: 1

      - step: "Assert export document is draft with only the two open moves"
        action: "assert"
        target: "export_doc"
        asserts:
          state:
            type: "value"
            expected: "draft"
          source_move_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: invoice_open_a.move_id"
              - "REC: invoice_open_b.move_id"
          move_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: invoice_open_a.move_id"
              - "REC: invoice_open_b.move_id"
          summary_ids:
            type: "o2m"
            check: "count"
            expected_count: 2

      - step: "Confirm the export document right away, no extra manual step"
        action: "call"
        target: "export_doc"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

  - name: "Wizard Run Over Two Admissions Merges Moves Without Duplicates"
