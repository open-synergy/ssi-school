          sequence: 10
          type_id: "REC: grade_type.id"

      - step: "Setup - create first student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact_a"
        values:
          name: "Student Contact AI2A"

      - step: "Setup - create second student contact"
        action: "create"
        model: "res.partner"
        save_as: "student_contact_b"
        values:
          name: "Student Contact AI2B"

      - step: "Create first admission"
        action: "create"
        model: "school_admission"
        save_as: "admission_a"
        as_user: "base.user_admin"
        values:
          customer_invoice_type_id: "REC: ci_type.id"
          receivable_account_id: "REC: ci_account.id"
          pricelist_id: "REF: product.list0"
          date: "2024-07-01"
          academic_year_id: "REC: academic_year.id"
          academic_term_id: "REC: academic_term.id"
          school_id: "REC: school.id"
          grade_id: "REC: grade.id"
          student_id: "REC: student_contact_a.id"
          currency_id: "REC: company.currency_id.id"
          receivable_journal_id: "REC: ci_journal.id"

      - step: "Confirm first admission"
        action: "call"
        target: "admission_a"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true

      - step: "Assert admission_a is approvable before approving"
        action: "assert"
        target: "admission_a"
